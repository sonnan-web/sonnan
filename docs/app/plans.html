<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خطط البرامج — منصة سنن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* نفس لغة تصميم «لوحة تقارير التعليم عن بعد»: شريط علوي داكن بحد ذهبي، رؤوس أقسام داكنة بحد ملوّن، بطاقات بحد علوي ملوّن */
:root{--primary:#0F2F33;--secondary:#173F43;--gold:#CBB994;--bg:#E9EFEF;--card:#fff;--line:#D9E3E3;--soft-line:#E4ECEC;--track:#E6EDED;--muted:#5F7679;--ink:#0F2F33;--green:#2F9E6E;--amber:#E3A21A;--red:#D64550;--blue:#3C82C4;--teal:#2A8C8C;--violet:#7B6CC4;--orange:#E07B4F;--slate:#7A8788}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',sans-serif;font-size:13px;line-height:1.55;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:17px;font-weight:800}h3{font-size:14px;font-weight:800}
p{margin:0}
a{color:var(--secondary)}

.top{background:linear-gradient(110deg,var(--primary),var(--secondary));color:#fff;padding:7px max(20px,env(safe-area-inset-left,0px));border-bottom:2px solid var(--gold);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top .brand{display:flex;align-items:center;gap:9px}
.top .mark{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:12px}
.top b{font-size:14.5px}.top small{color:var(--gold);display:inline;font-size:12px;font-weight:700;margin-inline-start:7px}
.top a,.top button{color:#DCE8E8;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:2px 12px;text-decoration:none;font-size:11.5px;font-weight:700}
.top a:hover,.top button:hover{background:rgba(255,255,255,.12)}
#who{color:#C9DADA;font-size:11.5px}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;padding:12px max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px));max-width:1560px;margin:0 auto;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.card{--a:var(--gold);background:var(--card);border:1px solid var(--line);border-top:3px solid var(--a);border-radius:12px;padding:11px 14px 14px;min-width:0}
aside.card{--a:var(--teal)}
.plans-list{display:grid;gap:6px}
.plans-list button{text-align:right;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-weight:700}
.plans-list button:hover{border-color:var(--gold)}
.plans-list button[aria-current="true"]{border-color:var(--secondary);background:color-mix(in srgb,var(--teal) 9%,#fff);border-right:4px solid var(--teal)}
.plans-list small{color:var(--muted);display:block;font-size:11px;font-weight:500}

.btn{border:0;border-radius:10px;padding:7px 15px;font-weight:700;background:var(--primary);color:#fff}
.btn:hover{background:var(--secondary)}
.btn.gold{background:var(--gold);color:var(--primary)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.danger{background:#fff;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,#fff)}
.btn.sm{padding:3px 10px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-block:10px 12px;padding:6px;border-radius:12px;background:linear-gradient(110deg,var(--primary),var(--secondary))}
.tabs button{background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:3px 14px;font-weight:700;font-size:12px;color:#DCE8E8}
.tabs button:hover{background:rgba(255,255,255,.12)}
.tabs button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:var(--primary)}

.grid{display:grid;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}}
label.f{display:grid;gap:3px;font-weight:700;font-size:12px}
label.f .hint,.hint{font-weight:500;color:var(--muted);font-size:11px}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],input[type=url],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;min-width:0;font-size:13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(203,185,148,.2)}
input:disabled,select:disabled{background:var(--track);color:var(--muted)}

/* رأس القسم مثل لوحة التقارير */
fieldset{--c:var(--gold);border:1px solid var(--line);border-radius:12px;padding:0 14px 14px;margin:0;display:grid;gap:10px;min-width:0;background:#fff}
fieldset>legend{float:right;width:calc(100% + 28px);margin:-1px -14px 2px;padding:7px 14px;border-radius:12px 12px 0 0;color:#fff;font-weight:800;font-size:14px;background:linear-gradient(110deg,var(--primary),var(--secondary));border-right:6px solid var(--c)}
fieldset>legend+*{clear:both}
fieldset.c-gold{--c:var(--gold)}fieldset.c-teal{--c:var(--teal)}fieldset.c-blue{--c:var(--blue)}fieldset.c-violet{--c:var(--violet)}fieldset.c-red{--c:var(--red)}

.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;cursor:pointer;background:#fff}
.choices label:has(input:checked){border-color:color-mix(in srgb,var(--teal) 45%,#fff);background:color-mix(in srgb,var(--teal) 11%,#fff);color:var(--secondary)}
.choices input{accent-color:var(--teal)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px dashed var(--soft-line);text-align:right;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{background:#EEF3F3;color:var(--primary);font-weight:800;font-size:11.5px;white-space:nowrap;border-bottom:1px solid var(--line)}
td input,td select{padding:4px 7px;font-size:12px}
td select{min-width:118px}
td.err{background:#FFF4F4;color:#8F2530}
td.emptyc{background:#FDE8E7;box-shadow:inset 0 0 0 1px #F1B9B5}
.warnbox{border:1px solid #F1B9B5;background:#FFF7F6;color:#8F4A2B;border-radius:10px;padding:8px 12px;font-size:12px}

.pill{display:inline-block;padding:1px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid}
.pill.ok{color:var(--green);background:color-mix(in srgb,var(--green) 11%,#fff);border-color:color-mix(in srgb,var(--green) 30%,#fff)}
.pill.bad{color:var(--red);background:color-mix(in srgb,var(--red) 10%,#fff);border-color:color-mix(in srgb,var(--red) 30%,#fff)}
.pill.warn{color:#9A6A08;background:color-mix(in srgb,var(--amber) 13%,#fff);border-color:color-mix(in srgb,var(--amber) 35%,#fff)}
.pill.plain{color:var(--muted);background:var(--track);border-color:var(--line)}
.pill.gold{color:#7A6534;background:color-mix(in srgb,var(--gold) 20%,#fff);border-color:var(--gold)}
.note{background:color-mix(in srgb,var(--gold) 14%,#fff);border:1px solid color-mix(in srgb,var(--gold) 45%,#fff);color:#5E4D27;border-radius:10px;padding:8px 12px;font-size:12px}
.errbox{border:1px solid var(--red);background:#FFF4F4;color:#8F2530;border-radius:10px;padding:8px 12px;font-size:12px}
.okbox{border:1px solid color-mix(in srgb,var(--green) 35%,#fff);background:color-mix(in srgb,var(--green) 9%,#fff);color:#1F6A4A;border-radius:10px;padding:8px 12px;font-size:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;background:#fff}
.drop.over{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,#fff)}
.preview-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:800px){.preview-cols{grid-template-columns:1fr}}
.phone{border:1px solid var(--line);border-top:3px solid var(--c,var(--teal));border-radius:12px;padding:11px 12px;background:#fff;display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border-radius:10px;padding:8px 11px;background:color-mix(in srgb,var(--teal) 7%,#fff);border:1px solid color-mix(in srgb,var(--teal) 22%,#fff)}
.task .tick{width:24px;height:24px;border-radius:50%;border:2px solid color-mix(in srgb,var(--teal) 40%,#fff);display:grid;place-items:center;font-weight:800;color:#fff;background:#fff}
.task .tick.on{background:var(--green);border-color:var(--green)}
.task .tick.none{visibility:hidden}
.task b{display:block;color:var(--primary)}
.ded{display:flex;align-items:center;gap:8px}
.ded button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800}
.score{font-size:22px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:9px 18px;border-radius:10px;font-weight:700;z-index:50;max-width:calc(100% - 32px);text-align:center;border-bottom:2px solid var(--gold)}
.toast.bad{background:#8F2530;border-bottom-color:var(--red)}
.login{max-width:400px;margin:60px auto}
.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;font-size:12px;background:#fff}
.colnum{color:var(--muted);font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.sticky-save{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 0 0;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>

<header class="top" id="topbar">
  <div class="brand"><span class="mark">سنن</span><div><b>خطط البرامج</b><small>منصة سنن</small></div></div>
  <div class="row" style="gap:8px"><span id="who" class="small"></span><a href="admin.html">لوحة المشرف</a><button type="button" id="logout" hidden>خروج</button></div>
</header>

<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
// ============ الإعداد ============
// ملاحظة: هذه قيم المشروع التجريبي. عند النقل لمشروع المنصة تُستبدل بـ SUPABASE_URL و ANON_KEY الخاصة به.
const SUPABASE_URL = 'https://ijkotzbzpduaqykumqtq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_0Ug3AHf8CWHpa4N1Hp9TvA_Ls7NMXaS';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: localStorage, storageKey: 'sonnan-app-auth' }
});

// ============ أدوات ============
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16)));
let toastT;
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const TASKS = { memo: 'حفظ', link: 'ربط', review: 'مراجعة', repeat: 'تكرار', explain: 'شرح', listen: 'سماع', custom: 'مهمة أخرى' };
const VTYPES = { number: 'رقم', text: 'نص', url: 'رابط', bool: 'نعم / لا' };
const ROLES = { single: 'قيمة مفردة', start: 'بداية نطاق (القيمة الدنيا)', end: 'نهاية نطاق (القيمة القصوى)' };
// لمن يظهر العمود (التنفيذ نفسه تحدده «القواعد»). «لا أحد»: عمود للحساب فقط لا يظهر لأحد
const EXEC = { student: 'للطالب', teacher: 'للمعلم', both: 'للمعلم والطالب', none: 'لا أحد (للحساب فقط)' };
const EXEC_OLD = { info: 'للطالب (عرض فقط)' };
const todayMakkah = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh' }).format(new Date());

// ============ الحالة ============
const S = { user: null, plans: [], plan: null, cols: [], removedCols: [], days: [], students: [], assignments: [], tab: 'rules', dirty: false, imported: null, previewDay: 1, previewTicks: {}, previewDed: {} };

function blankPlan() {
  return {
    id: null, name: '', description: '', book_name: '', audio_url: '', book_url: '', whatsapp_url: '', extra_links: [], status: 'draft',
    workdays: [0, 1, 2, 3, 4], recitation_mode: 'days', recitation_days: [0, 2],
    student_execution: 'counts', execution_weight: null, recitation_weight: null,
    score_rules: { max: 10, deductions: [{ key: 'full', label: 'خطأ كامل', value: 1 }, { key: 'half', label: 'نصف خطأ', value: 0.5 }, { key: 'quarter', label: 'ربع خطأ', value: 0.25 }] },
    discipline_rules: { absence_is: 'no_recitation', window_days: null, alert_after: null, warning_after: null, escalate_after: null, leave_max_month: null, makeup_within_days: null }
  };
}
function newCol(over) { return Object.assign({ id: uid(), header: '', task: 'memo', task_label: '', value_type: 'number', range_role: 'single', pair_column_id: null, shows_column_id: null, detail_of: null, executor: 'both', counts: true, weight: null, required: false, _new: true }, over || {}); }
function taskName(c) { return c.task === 'custom' ? (c.task_label || 'مهمة أخرى') : TASKS[c.task]; }

// ============ الدخول ============
const QS = new URLSearchParams(location.search);
const EMBED = QS.get('embed') === '1';
if (EMBED) { document.getElementById('topbar').style.display = 'none'; document.body.style.background = 'transparent'; }
function tellParent(type, extra) { if (EMBED && window.parent !== window) window.parent.postMessage(Object.assign({ source: 'plans', type }, extra || {}), location.origin); }
async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { if (EMBED) { $('#app').innerHTML = '<div class="empty">انتهت الجلسة. أعد الدخول من صفحة الدخول.</div>'; return; } return renderLogin(); }
  const { data: me } = await db.from('users').select('id, name, role').eq('id', session.user.id).maybeSingle();
  if (!me || me.role !== 'admin') { renderLogin('هذه الصفحة للمشرف فقط.'); return; }
  S.user = me;
  $('#who').textContent = me.name;
  $('#logout').hidden = false;
  await loadPlans();
  if (QS.get('tab')) S.tab = QS.get('tab');
  if (QS.get('id')) { await openPlan(QS.get('id')); if (QS.get('tab')) { S.tab = QS.get('tab'); render(); } }
  else if (QS.get('new') === '1' || !S.plans.length) startNew();
  else await openPlan(S.plans[0].id);
}
function renderLogin(msg) {
  $('#app').innerHTML = `<form class="card login grid" id="loginForm">
    <h2>دخول المشرف</h2>
    ${msg ? `<div class="errbox">${esc(msg)}</div>` : ''}
    <label class="f" for="le">البريد الإلكتروني<input id="le" type="email" dir="ltr" required autocomplete="email"></label>
    <label class="f" for="lp">كلمة المرور<input id="lp" type="password" dir="ltr" required autocomplete="current-password"></label>
    <button class="btn" type="submit">دخول</button></form>`;
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const { error } = await db.auth.signInWithPassword({ email: $('#le').value.trim(), password: $('#lp').value });
    if (error) return renderLogin('البريد أو كلمة المرور غير صحيحة.');
    boot();
  });
}
$('#logout').addEventListener('click', async () => { await db.auth.signOut(); location.reload(); });

// ============ التحميل ============
async function loadPlans() {
  const { data, error } = await db.from('program_plans').select('id, name, status, book_name').order('created_at');
  if (error) return toast('تعذّر تحميل الخطط: ' + error.message, true);
  S.plans = data || [];
}
async function openPlan(id) {
  const [p, c, d] = await Promise.all([
    db.from('program_plans').select('*').eq('id', id).single(),
    db.from('plan_columns').select('*').eq('plan_id', id).order('seq'),
    db.from('plan_days').select('id, day_number, vals').eq('plan_id', id).order('day_number')
  ]);
  if (p.error) return toast('تعذّر فتح الخطة', true);
  S.plan = p.data;
  S.plan.score_rules = S.plan.score_rules || blankPlan().score_rules;
  S.plan.discipline_rules = Object.assign(blankPlan().discipline_rules, S.plan.discipline_rules || {});
  S.cols = c.data || [];
  S.removedCols = [];
  S.days = d.data || [];
  S.imported = null; S.dirty = false; S.previewDay = 1; S.previewTicks = {}; S.previewDed = {};
  render();
}
function startNew() {
  S.plan = blankPlan();
  S.cols = [
    newCol({ header: 'الحفظ من حديث', task: 'memo', range_role: 'start' }),
    newCol({ header: 'الحفظ إلى حديث', task: 'memo', range_role: 'end' })
  ];
  S.cols[0].pair_column_id = S.cols[1].id; S.cols[1].pair_column_id = S.cols[0].id;
  S.removedCols = []; S.days = []; S.imported = null; S.tab = 'rules'; S.dirty = true;
  render();
}

// ============ العرض ============
function render() {
  const P = S.plan;
  $('#app').innerHTML = `<div class="layout"${EMBED ? ' style="grid-template-columns:minmax(0,1fr);padding:0"' : ''}>
    <aside class="card grid"${EMBED ? ' hidden' : ''}>
      <div class="row"><h3>الخطط</h3><button class="btn sm gold" type="button" id="newPlan">+ خطة جديدة</button></div>
      <div class="plans-list">${S.plans.map(p => `<button type="button" data-open="${p.id}" aria-current="${P && p.id === P.id}">${esc(p.name)}<small>${esc(p.book_name || '')} · ${p.status === 'active' ? 'مفعّلة' : p.status === 'archived' ? 'مؤرشفة' : 'مسودة'}</small></button>`).join('') || '<p class="muted small">لا توجد خطط بعد.</p>'}</div>
      <p class="hint">الخطة هي طريقة البرنامج: أعمدتها، ولمن تظهر، وأيام التسميع، وقواعد التنبيه والإنذار. أنشئها ثم أسندها للطلاب.</p>
    </aside>
    <section class="card">
      <div class="row">
        <div><h2>${esc(P.name || 'خطة جديدة')}</h2><p class="muted small">${S.cols.length} عمود · ${S.days.length} يوم${P.id ? '' : ' · لم تُحفظ بعد'}</p></div>
        <div class="row" style="gap:6px">${S.dirty ? '<span class="pill warn">تغييرات غير محفوظة</span>' : P.id ? '<span class="pill ok">محفوظة</span>' : ''}<button class="btn" type="button" id="savePlan">حفظ الخطة</button></div>
      </div>
      <div class="tabs" role="tablist">
        ${[['rules', '١. القواعد'], ['columns', '٢. أعمدة الخطة'], ['days', '٣. أيام الخطة والإكسل'], ['preview', '٤. المعاينة'], ['assign', '٥. الإسناد للطلاب']].map(t => `<button type="button" role="tab" data-tab="${t[0]}" aria-selected="${S.tab === t[0]}">${t[1]}</button>`).join('')}
      </div>
      <div id="tab"></div>
    </section></div>`;
  if (EMBED) $('aside').remove();
  $('#newPlan')?.addEventListener('click', () => { if (S.dirty && !confirmLeave()) return; startNew(); });
  if (false) $('#newPlan').onclick = () => { if (S.dirty && !confirmLeave()) return; startNew(); };
  $$('[data-open]').forEach(b => b.onclick = () => { if (S.dirty && !confirmLeave()) return; openPlan(b.dataset.open); });
  $$('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  $('#savePlan').onclick = savePlan;

      if (c.value_type === 'number') { const n = Number(toWestern(v)); if (isNaN(n)) errors[c.id] = 'ليس رقمًا'; else v = n; }
      else if (c.value_type === 'bool') { const s = norm(v); v = ['1', 'نعم', 'yes', 'true', '✓', 'صح'].includes(s); }
      else if (c.value_type === 'url') { if (!/^https?:\/\//i.test(String(v))) errors[c.id] = 'رابط غير صالح'; }
      else v = String(v);
      vals[c.id] = v;
    });
    S.cols.filter(c => c.range_role === 'start' && c.value_type === 'number').forEach(c => {
      const e = S.cols.find(x => x.id === c.pair_column_id);
      if (e && typeof vals[c.id] === 'number' && typeof vals[e.id] === 'number' && vals[c.id] > vals[e.id]) errors[e.id] = '«' + c.header + '» أكبر من «' + e.header + '»';
      if (e && (vals[c.id] != null) !== (vals[e.id] != null)) empty[vals[c.id] == null ? c.id : e.id] = 'النطاق ناقص';
    });
    rows.push({ day_number: dn, vals, errors, empty, line: hi + ri + 2 });
  });
  rows.sort((a, b) => a.day_number - b.day_number);
  return { file: fileName, rows, matched, unknown, missing, problems };
}

// ---------- ٤. المعاينة ----------
// الوزن الفارغ يأخذ الباقي من 100 بالتساوي
function normW(ws) { const has = w => w != null && w !== '' && !isNaN(+w); const g = ws.filter(has).reduce((a, w) => a + +w, 0), f = ws.filter(w => !has(w)).length, rest = Math.max(0, 100 - g); const o = ws.map(w => has(w) ? +w : (f ? rest / f : 0)); const t = o.reduce((a, b) => a + b, 0); return t ? o.map(w => w / t) : ws.map(() => 1 / (ws.length || 1)); }
const tW = t => { const c = t.cols.find(c => c.weight != null && c.weight !== ''); return c ? +c.weight : null; };
const gradedP = () => groupTasks(c => c.executor === 'teacher' || c.executor === 'both').filter(t => t.cols.some(c => c.counts));
const execP = () => { const all = groupTasks(c => c.executor === 'student' || c.executor === 'both').filter(t => t.single?.value_type !== 'url'); const g = all.filter(t => t.cols.some(c => c.counts)); return g.length ? g : all; };
function groupTasks(filterFn) {
  // يجمع كل عمودين مرتبطين في مهمة واحدة؛ وعمود «تفاصيل لـ» يُعرض داخل مهمته
  const out = [], used = {};
  const detOf = c => c.detail_of || (c.pair_column_id && S.cols.find(x => x.id === c.pair_column_id)?.detail_of);
  S.cols.forEach(c => {
    if (used[c.id] || !filterFn(c) || detOf(c)) return;
    if (c.pair_column_id) { const o = S.cols.find(x => x.id === c.pair_column_id); if (o) { used[o.id] = 1; const [a, b] = c.range_role === 'start' ? [c, o] : [o, c]; out.push({ key: a.id, name: taskName(a), from: a, to: b, cols: [a, b] }); return; } }
    out.push({ key: c.id, name: taskName(c), single: c, cols: [c] });
  });
  return out;
}
// تفاصيل المهمة (أعمدة «تفاصيل لـ») داخل بطاقتها في المعاينة
function previewDetails(t, vals) {
  const ids = t.cols.map(c => c.id);
  return S.cols.filter(c => ids.includes(c.detail_of) && c.range_role !== 'end').map(c => { const e = c.pair_column_id && S.cols.find(x => x.id === c.pair_column_id); const a = vals[c.id], b = e ? vals[e.id] : null;
    if (a == null && b == null) return ''; return `<span class="v" style="display:block;font-size:12px">${esc(c.header.replace(/\s*(من|إلى)\s*$/, '').trim())}: ${esc(e ? (c.value_type === 'text' ? `${a ?? '؟'} ← ${b ?? '؟'}` : fmtRangeP(c, a, b)) : String(a))}</span>`; }).join('');
}
function fmtTask(t, vals) {
  if (t.single) { const v = vals[t.single.id]; if (v == null || v === '') return null;
    if (t.single.value_type === 'bool') { if (!v) return null; const sc = S.cols.find(c => c.id === t.single.shows_column_id), ec = sc && S.cols.find(c => c.id === sc.pair_column_id); const a = sc && vals[sc.id], b = ec && vals[ec.id]; return t.single.header + (a != null || b != null ? ': ' + fmtRangeP(sc, a, b) : ''); }
    return t.single.value_type === 'url' ? 'رابط' : `${t.single.header}: ${v}`; }
  const a = vals[t.from.id], b = vals[t.to.id];

}
// وحدة النطاق من اسم العمود: «مراجعة من حديث» ← «من حديث 1 إلى حديث 2»
function fmtRangeP(c, a, b) { const u = c?.value_type === 'number' ? ((String(c.header || '').match(/من\s+([^\s\d]+)/) || [])[1] || '') : ''; return u ? `من ${u} ${a ?? '؟'} إلى ${u} ${b ?? '؟'}` : `من ${a ?? '؟'} إلى ${b ?? '؟'}`; }
function tabPreview() {

async function savePlan() {
  const P = S.plan;
  if (!String(P.name).trim()) { S.tab = 'rules'; render(); return toast('اكتب اسم الخطة', true); }
  const issues = columnIssues();
  if (issues.length) { S.tab = 'columns'; render(); return toast('في الأعمدة أخطاء يجب تصحيحها', true); }
  if (P.recitation_mode === 'days' && !P.recitation_days.length) { S.tab = 'rules'; render(); return toast('اختر أيام التسميع', true); }
  if (!P.workdays.length) { S.tab = 'rules'; render(); return toast('اختر يومًا واحدًا على الأقل لتقدّم الخطة', true); }
  if (P.recitation_mode === 'none' && P.student_execution === 'none') { S.tab = 'rules'; render(); return toast('اختر التسميع أو تنفيذ الطالب، فالخطة بلا الاثنين لا يُقيَّم فيها شيء', true); }
  if (P.recitation_mode !== 'none' && P.student_execution === 'counts' && P.execution_weight != null && P.recitation_weight != null && P.execution_weight + P.recitation_weight !== 100) { S.tab = 'rules'; render(); return toast('مجموع وزن التنفيذ ووزن التسميع يجب أن يكون 100', true); }
  const btn = $('#savePlan'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
  try {
    const row = { name: P.name.trim(), description: P.description || null, book_name: P.book_name || null, audio_url: P.audio_url || null, book_url: P.book_url || null, whatsapp_url: P.whatsapp_url || null, extra_links: (P.extra_links || []).filter(l => (l.url || '').trim()).map(l => ({ label: (l.label || '').trim() || 'رابط', url: l.url.trim() })), status: P.status,
      workdays: P.workdays, recitation_mode: P.recitation_mode, recitation_days: P.recitation_days, student_execution: P.student_execution,
      execution_weight: P.execution_weight, recitation_weight: P.recitation_weight, score_rules: P.score_rules, discipline_rules: P.discipline_rules };
    let planId = P.id;
    if (planId) { const r = await db.from('program_plans').update(row).eq('id', planId); if (r.error) throw r.error; }
    else { row.created_by = S.user.id; const r = await db.from('program_plans').insert(row).select('id').single(); if (r.error) throw r.error; planId = r.data.id; }
    if (S.removedCols.length) { const r = await db.from('plan_columns').delete().in('id', S.removedCols); if (r.error) throw r.error; }
    // الأعمدة بطلب واحد: الترتيب والاسم والارتباط معًا (قيود التفرد مؤجلة لنهاية الطلب)
    const colRows = S.cols.map((c, i) => ({ id: c.id, plan_id: planId, seq: i + 1, header: c.header.trim(), task: c.task, task_label: c.task === 'custom' ? c.task_label : null, value_type: c.value_type, range_role: c.range_role, pair_column_id: c.pair_column_id || null, shows_column_id: c.value_type === 'bool' && c.range_role === 'single' ? (c.shows_column_id || null) : null, detail_of: c.range_role === 'end' ? null : (c.detail_of || null), executor: c.executor, counts: ['info', 'none'].includes(c.executor) ? false : !!c.counts, weight: c.weight, required: !!c.required }));
    let r = await db.from('plan_columns').upsert(colRows); if (r.error) throw r.error;
    // الأيام: تُستبدل بالكامل عند تغييرها
    const ids = new Set(S.cols.map(c => c.id));

    const drop = (existing.data || []).filter(d => !keep.has(d.day_number)).map(d => d.id);
    if (drop.length) { r = await db.from('plan_days').delete().in('id', drop); if (r.error) throw r.error; }
    for (let i = 0; i < dayRows.length; i += 500) { r = await db.from('plan_days').upsert(dayRows.slice(i, i + 500), { onConflict: 'plan_id,day_number' }); if (r.error) throw r.error; }
    S.dirty = false;
    await loadPlans();
    toast('حُفظت الخطة');
    tellParent('saved', { id: planId });
    const tab = S.tab; await openPlan(planId); S.tab = tab; render();
  } catch (e) {
    toast('لم تُحفظ: ' + (e.message || e), true);
    btn.disabled = false; btn.textContent = 'حفظ الخطة';
  }
}
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
boot();
</script>
</body>
</html>
