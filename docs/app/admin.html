<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>لوحة المشرف — منصة سنن</title>
<meta name="theme-color" content="#0F2F33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سنن">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=20261127n">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js?v=20261127n"></script>
<style>
.plan-frame{width:100%;min-height:80vh;border:0;border-radius:12px;background:transparent}
.cols-chart{display:flex;gap:3px;height:150px;align-items:stretch;overflow-x:auto;padding-bottom:2px}
.cols-chart .col{flex:1;min-width:14px;display:flex;flex-direction:column;align-items:center}
.cols-chart .v{font-size:10px;font-weight:800;min-height:14px;font-variant-numeric:tabular-nums}
.cols-chart .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.cols-chart .b{width:72%;min-height:2px;border-radius:4px 4px 0 0;background:var(--teal)}
.cols-chart .l{font-size:9px;color:var(--muted);white-space:nowrap}
#sTbl td{white-space:normal;min-width:70px}
#sTbl td:first-child{min-width:130px}
#sTbl .opts{display:flex;flex-wrap:wrap;gap:4px;min-width:150px}
.rank-row{display:grid;grid-template-columns:40px 1fr auto auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px dashed var(--soft-line)}
.rank-row .r{font-weight:800;color:#7A6534;text-align:center}
.rank-row:nth-child(-n+3) .r{color:#fff;background:var(--gold);border-radius:8px;padding:2px 0}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><button class="pillbtn menu-btn" type="button" id="menuBtn" aria-label="القائمة">☰</button><span class="mark">سنن</span><h1>لوحة المشرف<span class="sep">|</span><span class="prog" id="secTitle">الرئيسية</span></h1></div>
  <div class="tools"><span id="today"></span><span id="who"></span><div class="icons" id="icons"></div></div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="أقسام لوحة المشرف"></nav>
  <main class="main" id="main"><div class="loading">جارٍ التحميل…</div></main>
</div>
<script>
(async () => {
'use strict';
const A = App, { db, $, $$, esc, norm, fmtNum, toast, fetchAll, dataTable, fullscreenBtn, drawer, closeDrawer, confirmBox, statusPill, STATUS, STU_STATUS, svg } = A;
const me = await A.requireRole(['admin']);
if (!me) return;
$('#who').textContent = me.name;
const TODAY = A.todayMakkah();
$('#today').textContent = A.hijri(TODAY) + ' · ' + A.greg(TODAY);
A.topIcons($('#icons'));
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');

// ============ القائمة ============
const NAV = [
  ['التشغيل اليومي', [['home', 'الرئيسية', 'home'], ['daily', 'المتابعة اليومية للتسميع', 'mic'], ['dexec', 'المتابعة اليومية للواجب', 'exam'], ['recs', 'سجل رصد المعلم', 'list'], ['srecs', 'سجل رصد الطالب', 'book']]],
  ['الطلاب', [['students', 'الطلاب وملفاتهم', 'users'], ['leaves', 'الاستئذان', 'leave'], ['discipline', 'الانضباط والمتابعة', 'alert'], ['actions', 'إجراءات المشرف', 'bell'], ['exams', 'الاختبارات المرحلية', 'exam'], ['honor', 'لوحة الشرف', 'star']]],
  ['البرامج', [['plans', 'خطط البرامج', 'plan']]],
  ['المعلمون والفترات', [['teachers', 'المعلمون', 'teacher'], ['rooms', 'الفترات والغرف الصوتية', 'room']]],
  ['التواصل', [['notify', 'الإشعارات', 'bell']]],
  ['التقارير', [['summary', 'التقرير الإجمالي', 'list'], ['tsess', 'جلسات المعلمين', 'teacher'], ['reports', 'لوحة التقارير', 'report']]],
  ['الحساب', [['profile', 'ملفي الشخصي', 'user']]]
];
const TITLES = Object.fromEntries(NAV.flatMap(g => g[1].map(x => [x[0], x[1]])));
function drawNav(cur) {
  $('#side').innerHTML = NAV.map(([g, items]) => `<div class="grp">${g}</div>${items.map(([k, l, ic]) => `<a href="#${k}" aria-current="${cur === k ? 'page' : 'false'}">${svg(ic)}<span>${l}</span>${k === 'leaves' && D.pendingLeaves ? `<span class="badge">${D.pendingLeaves}</span>` : ''}</a>`).join('')}`).join('');
}

// ============ البيانات ============
const D = { loaded: false };
async function loadCore() {
  const [users, students, teachers, rooms, ra, plans, pa, leaves, programs, holds] = await Promise.all([
    fetchAll(() => db.from('users').select('id, name, email, role, phone, created_at')),
    fetchAll(() => db.from('students').select('*')),
    db.from('teachers').select('*').then(r => r.data || []),
    db.from('audio_rooms').select('*').order('sort').then(r => r.data || []),
    fetchAll(() => db.from('room_assignments').select('*')),
    db.from('program_plans').select('*').order('created_at').then(r => r.data || []),
    fetchAll(() => db.from('plan_assignments').select('*').is('ended_at', null)),
    db.from('leave_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
    db.from('programs').select('*').order('name').then(r => r.data || []),
    fetchAll(() => db.from('stage_holds').select('*'))
  ]);
  D.programs = programs; D.programById = Object.fromEntries(programs.map(p => [p.id, p]));
  D.users = users; D.userById = Object.fromEntries(users.map(u => [u.id, u]));
  D.teachers = teachers.map(t => ({ ...t, name: D.userById[t.user_id]?.name || '—', email: D.userById[t.user_id]?.email }));
  D.teacherById = Object.fromEntries(D.teachers.map(t => [t.id, t]));
  D.rooms = rooms; D.roomById = Object.fromEntries(rooms.map(r => [r.id, r]));
  D.ra = ra;
  D.plans = plans; D.planById = Object.fromEntries(plans.map(p => [p.id, p]));
  D.holds = holds;
  pa.forEach(a => a.holds = holds.filter(h => h.student_id === a.student_id));
  D.assignByStudent = Object.fromEntries(pa.map(a => [a.student_id, a]));
  D.roomOfStudent = {}; D.roomsOfTeacher = {};
  ra.forEach(a => { if (a.assignee_type === 'student') D.roomOfStudent[a.assignee_id] = a.room_id; else (D.roomsOfTeacher[a.assignee_id] ||= []).push(a.room_id); });
  D.students = students.map(s => { const u = D.userById[s.user_id] || {}; const a = D.assignByStudent[s.id]; return { ...s, name: u.name || '—', email: u.email, teacher: D.teacherById[s.teacher_id]?.name || '—', room: D.roomById[D.roomOfStudent[s.id]]?.name || '—', plan: a ? (D.planById[a.plan_id]?.name || '—') : '—', planObj: a ? D.planById[a.plan_id] : null, assign: a, statusLabel: (STU_STATUS[s.status] || [s.status])[0] }; });
  D.studentById = Object.fromEntries(D.students.map(s => [s.id, s]));
  D.pendingLeaves = leaves.count || 0;
  D.loaded = true;
}
async function loadRecs(force) {
  if (D.recs && !force) return D.recs;
  D.recs = await fetchAll(() => db.from('plan_recitations').select('id, student_id, teacher_id, rec_date, status, score, memo_from, memo_to, errors_total, notes, room_id, plan_id, vals, deductions, makes_up_date, created_at').is('superseded_by', null).order('rec_date', { ascending: false }));
  D.recsByStudent = {};
  D.recs.forEach(r => (D.recsByStudent[r.student_id] ||= []).push(r));
  return D.recs;
}
const actives = () => D.students.filter(s => s.status === 'active' && !s.is_archived);
const ACH = ['present', 'makeup', 'review_only'];
// إحصاءات طالب في فترة
function statsOf(s, from, to) {
  const rs = (D.recsByStudent[s.id] || []).filter(r => (!from || r.rec_date >= from) && (!to || r.rec_date <= to));
  const c = { present: 0, makeup: 0, review_only: 0, excused: 0, absent: 0 };
  rs.forEach(r => c[r.status] = (c[r.status] || 0) + 1);
  const scores = rs.filter(r => r.score != null).map(r => +r.score);
  const plan = s.planObj, wd = plan?.workdays || [0, 1, 2, 3, 4];
  const start = [s.assign?.start_date, s.join_date, from].filter(Boolean).sort().pop();
  const end = [to || TODAY, TODAY].sort()[0];
  const expected = A.workdaysBetween(start, end, wd);
  const achDays = new Set(rs.filter(r => ACH.includes(r.status)).map(r => r.rec_date)).size;
  const excDays = new Set(rs.filter(r => r.status === 'excused').map(r => r.rec_date)).size;
  const base = Math.max(0, expected - excDays);
  return { count: rs.length, ...c, avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null,
    memorized: A.unionCount(rs.filter(r => ['present', 'makeup'].includes(r.status)).map(r => [r.memo_from == null ? null : +r.memo_from, r.memo_to == null ? null : +r.memo_to])),
    last: rs[0]?.rec_date || null, expected, achDays, absences: s.assign ? Math.max(0, base - achDays) : 0, pct: base && s.assign ? Math.min(100, Math.round(achDays / base * 100)) : null };
}
const lastRecOf = s => (D.recsByStudent[s.id] || [])[0]?.rec_date || null;

// ============ التوجيه ============
const SECTIONS = {};
let current = null, routeSeq = 0;
async function route() {
  const my = ++routeSeq;
  const key = (location.hash || '#home').slice(1);
  const sec = SECTIONS[key] ? key : 'home';
  current = sec;
  if (!D.loaded) await loadCore();
  if (my !== routeSeq) return;
  drawNav(sec);
  $('#side').classList.remove('open');
  $('#secTitle').textContent = TITLES[sec];
  document.title = TITLES[sec] + ' — لوحة المشرف';
  // كل قسم يُرسم في حاوية جديدة؛ إذا انتقل المستخدم لقسم آخر قبل اكتمال التحميل تُهمل الحاوية القديمة
  const host = document.createElement('div');
  host.innerHTML = '<div class="loading">جارٍ التحميل…</div>';
  $('#main').replaceChildren(host);
  try { await SECTIONS[sec](host); }
  catch (e) { if (my === routeSeq && host.isConnected) { console.error(e); host.innerHTML = `<div class="error">تعذّر تحميل القسم: ${esc(e.message || e)}</div>`; } }
  if (my === routeSeq) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
const secHead = (title, sub, color, acts) => `<div class="sec-h" style="--c:var(--${color || 'gold'})"><b>${esc(title)}</b>${sub ? `<span>${sub}</span>` : ''}${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
const mini = (label, val, color, small) => `<div class="mini" style="--c:var(--${color})"><span>${esc(label)}</span><b>${val}</b>${small ? `<small>${small}</small>` : ''}</div>`;
const cardFull = el => { const h = el.querySelector('.head'); if (h) h.appendChild(fullscreenBtn(el)); };
function bars(items, color, fmt) {
  const max = Math.max(1, ...items.map(i => i[1]));
  return `<div class="bars">${items.map(([l, v, c]) => `<div class="br"><span class="lb" title="${esc(l)}">${esc(l)}</span><span class="t"><span class="f" style="width:${(v / max * 100).toFixed(1)}%;background:${c || color || 'var(--teal)'}"></span></span><span class="n">${fmt ? fmt(v) : fmtNum(v)}</span></div>`).join('') || '<div class="empty">لا توجد بيانات</div>'}</div>`;
}
function donut(parts, centerLabel) {
  const total = parts.reduce((a, p) => a + p[1], 0) || 1;
  let acc = 0;
  const grad = parts.map(([, v, c]) => { const a = acc / total * 360; acc += v; return `${c} ${a}deg ${acc / total * 360}deg`; }).join(',');
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${grad || 'var(--track) 0deg 360deg'})"><div class="mid"><b>${fmtNum(total === 1 && !parts.some(p => p[1]) ? 0 : total)}</b><span>${esc(centerLabel)}</span></div></div>
    <div class="legend">${parts.map(([l, v, c]) => `<div class="lg"><i style="background:${c}"></i><em>${esc(l)}</em><span class="n">${fmtNum(v)}</span><span class="p">${(v / total * 100).toFixed(0)}٪</span></div>`).join('')}</div></div>`;
}
// أعمدة التصدير لمهام الخطة: كل قيمة في عمود مستقل (النطاق «من» و«إلى» عمودان، والأرقام أرقام)
const expVal = (c, v) => v == null || v === '' ? null : c.value_type === 'number' && !isNaN(+v) ? +v : c.value_type === 'bool' ? (v ? 'نعم' : 'لا') : v;
const taskExpCols = (tasks, valsOf) => tasks.flatMap(t => (t.single ? [t.single] : [t.from, t.to]).map(c => [String(c.header).trim(), x => expVal(c, (valsOf(x) || {})[c.id])]));
const opt = (v, l, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(l)}</option>`;
const teacherOpts = sel => D.teachers.filter(t => !t.is_archived).map(t => opt(t.id, t.name, t.id === sel)).join('');
const roomOpts = sel => D.rooms.map(r => opt(r.id, r.name + (r.start_time ? ' (' + r.start_time.slice(0, 5) + ')' : ''), r.id === sel)).join('');
const planOpts = sel => D.plans.filter(p => p.status !== 'archived').map(p => opt(p.id, p.name, p.id === sel)).join('');

// ============ الرئيسية ============
SECTIONS.home = async el => {
  await loadRecs();
  const act = actives();
  const todayRecs = D.recs.filter(r => r.rec_date === TODAY);
  const todayStu = new Set(todayRecs.map(r => r.student_id));
  const { data: warns } = await db.from('discipline_events').select('id, kind').eq('status', 'active').gte('event_date', A.addDays(TODAY, -30));
  const cut = A.addDays(TODAY, -5);
  const stale = act.filter(s => { const l = lastRecOf(s); return !l || l < cut; }).map(s => ({ s, l: lastRecOf(s) })).sort((a, b) => (a.l || '') < (b.l || '') ? -1 : 1);
  const stats = act.map(s => ({ s, st: statsOf(s) }));
  const top = stats.slice().sort((a, b) => b.st.memorized - a.st.memorized).slice(0, 5);
  const tAct = D.teachers.map(t => ({ t, n: todayRecs.filter(r => r.teacher_id === t.id).length, stu: D.students.filter(s => s.teacher_id === t.id && s.status === 'active').length })).sort((a, b) => b.n - a.n);
  el.innerHTML = `${secHead('أهلًا بك، ' + me.name, A.hijri(TODAY) + ' · ' + A.dayName(TODAY), 'gold')}
    <div class="card" style="--a:var(--teal);margin-bottom:10px"><div class="minis">
      ${mini('الطلاب المنتظمون', fmtNum(act.length), 'teal', 'من ' + fmtNum(D.students.length) + ' مسجلًا')}
      ${mini('المعلمون', fmtNum(D.teachers.filter(t => !t.is_archived).length), 'blue')}
      ${mini('رُصد اليوم', fmtNum(todayStu.size) + '<em>طالبًا</em>', 'green', act.length ? Math.round(todayStu.size / act.length * 100) + '٪ من المنتظمين' : '')}
      ${mini('لم يُرصدوا اليوم', fmtNum(act.length - todayStu.size), 'amber')}
      ${mini('استئذانات بانتظار القرار', fmtNum(D.pendingLeaves), 'violet')}
      ${mini('تنبيهات وإنذارات (30 يومًا)', fmtNum((warns || []).length), 'red')}
    </div></div>
    <div class="grid">
      <div class="card c-red span6"><div class="head"><h3>منقطعون عن التسميع أكثر من 5 أيام</h3><span class="pill bad">${stale.length}</span></div>
        <div class="tbl-wrap" style="max-height:340px"><table><thead><tr><th>الطالب</th><th>المعلم</th><th>آخر رصد</th><th>منذ</th></tr></thead><tbody>
        ${stale.slice(0, 50).map(x => `<tr class="click" data-stu="${x.s.id}"><td>${esc(x.s.name)}</td><td>${esc(x.s.teacher)}</td><td>${x.l ? A.greg(x.l) : 'لا يوجد'}</td><td class="num">${x.l ? A.daysBetween(x.l, TODAY) + ' يوم' : '—'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">لا يوجد</td></tr>'}</tbody></table></div></div>
      <div class="card c-green span6"><div class="head"><h3>الأعلى حفظًا</h3><a href="#honor" class="small">لوحة الشرف كاملة</a></div>
        ${bars(top.map(x => [x.s.name, x.st.memorized]), 'var(--green)', v => fmtNum(v, 1) + ' حديث')}</div>
      <div class="card c-blue span12"><div class="head"><h3>نشاط المعلمين اليوم</h3></div>
        ${bars(tAct.map(x => [x.t.name + ' (' + x.stu + ' طالب)', x.n]), 'var(--blue)', v => fmtNum(v) + ' رصد')}</div>
    </div>`;
  $$('[data-stu]', el).forEach(tr => tr.onclick = () => studentFile(tr.dataset.stu));
};

// ============ المتابعة اليومية: للتسميع، وللواجب (تنفيذ الطالب) ============
SECTIONS.daily = el => followSection(el, 'rec');
SECTIONS.dexec = el => followSection(el, 'exec');
const FOL = { plan: '', mode: 'day', date: TODAY, from: A.addDays(TODAY, -13), to: TODAY, month: TODAY.slice(0, 7), cFrom: TODAY.slice(0, 8) + '01', cTo: TODAY };
const PROG_CACHE = {};
async function planProgress(planId) {
  if (PROG_CACHE[planId]) return PROG_CACHE[planId];
  const P = PLANS_FULL[planId];
  const dayOf = {}; Object.values(P.days).forEach(d => dayOf[d.id] = d.day_number);
  const ids = actives().filter(s => s.assign?.plan_id === planId).map(s => s.id);
  const by = {};
  // دفعات من الطلاب حتى لا يطول الطلب
  for (let i = 0; i < ids.length; i += 60) {
    const rows = await fetchAll(() => db.from('plan_progress').select('student_id, plan_day_id, column_id').in('student_id', ids.slice(i, i + 60)));
    rows.forEach(x => { const dn = dayOf[x.plan_day_id]; if (dn == null) return; ((by[x.student_id] ||= {})[dn] ||= new Set()).add(x.column_id); });
  }
  return (PROG_CACHE[planId] = by);
}
const isWork = (P, d) => (P.workdays || []).includes(new Date(d + 'T12:00:00Z').getUTCDay());
function datesBetween(a, b) { const out = []; for (let d = a; d <= b && out.length < 400; d = A.addDays(d, 1)) out.push(d); return out; }
async function followSection(el, kind) {
  await loadRecs();
  const PL = await plansFull();
  const usable = D.plans.filter(p => p.status !== 'archived');
  if (!FOL.plan || !PL[FOL.plan]) FOL.plan = (usable.find(p => p.status === 'active') || usable[0])?.id || '';
  const P = PL[FOL.plan];
  const isR = kind === 'rec';
  const color = isR ? 'teal' : 'violet';
  const title = isR ? 'المتابعة اليومية للتسميع' : 'المتابعة اليومية للواجب';
  const day = FOL.date, from = FOL.from, to = [FOL.to, TODAY].sort()[0];
  el.innerHTML = `${secHead(title, P ? esc(P.name) : '', color, `<button class="btn ghost sm" id="fExport">تصدير إلى إكسل</button>`)}
    <div class="card" style="--a:var(--${color});margin-bottom:10px"><div class="tbl-tools" style="margin:0">
      <label class="small">الخطة <select id="fPlan" style="width:auto">${usable.map(p => opt(p.id, p.name, p.id === FOL.plan)).join('')}</select></label>
      <div class="seg"><button type="button" data-m="day" aria-pressed="${FOL.mode === 'day'}">يوم</button><button type="button" data-m="range" aria-pressed="${FOL.mode === 'range'}">فترة</button><button type="button" data-m="cal" aria-pressed="${FOL.mode === 'cal'}">تقويم</button></div>
      ${FOL.mode === 'cal' ? `<label class="small">من <input type="date" id="fcF" value="${FOL.cFrom}" style="width:auto"></label><label class="small">إلى <input type="date" id="fcT" value="${FOL.cTo}" style="width:auto"></label>
        <div class="seg"><button type="button" data-cq="month">هذا الشهر</button><button type="button" data-cq="prev">الشهر السابق</button><button type="button" data-cq="30">آخر 30 يومًا</button></div><input type="search" id="fQ" placeholder="بحث باسم الطالب…" style="width:auto;min-width:170px">`
        : FOL.mode === 'day' ? `<button class="btn ghost sm" id="fPrev" type="button">السابق</button><input type="date" id="fDate" value="${day}" style="width:auto"><button class="btn ghost sm" id="fNext" type="button">التالي</button><span class="small muted">${A.dayName(day)} · ${A.hijri(day)}</span>`
        : `<label class="small">من <input type="date" id="fFrom" value="${from}" style="width:auto"></label><label class="small">إلى <input type="date" id="fTo" value="${FOL.to}" style="width:auto"></label>`}
    </div></div>
    <div class="card" style="--a:var(--${color});margin-bottom:10px" id="fKpi"></div>
    <div class="card c-${color}" id="fCard"><div class="head"><h3 id="fTitle"></h3><span class="hint" id="fHint"></span></div><div id="fTbl"></div></div>`;

  $('#fMonth') && ($('#fMonth').onchange = e => { if (e.target.value) { FOL.month = e.target.value; route(); } });
  $('#fcF') && ($('#fcF').onchange = e => { if (e.target.value) { FOL.cFrom = e.target.value; if (FOL.cTo < FOL.cFrom) FOL.cTo = FOL.cFrom; route(); } });

  $$('[data-cq]', el).forEach(b => b.onclick = () => { const q = b.dataset.cq; if (q === 'month') { FOL.cFrom = TODAY.slice(0, 8) + '01'; FOL.cTo = TODAY; } else if (q === '30') { FOL.cFrom = A.addDays(TODAY, -29); FOL.cTo = TODAY; } else { const [y, m] = TODAY.split('-').map(Number); const d = new Date(Date.UTC(y, m - 2, 1)); FOL.cFrom = d.toISOString().slice(0, 10); FOL.cTo = new Date(Date.UTC(y, m - 1, 0)).toISOString().slice(0, 10); } route(); });
  $('#fmPrev') && ($('#fmPrev').onclick = () => { FOL.month = shiftMonth(-1); route(); });
  $('#fmNext') && ($('#fmNext').onclick = () => { FOL.month = shiftMonth(1); route(); });
  cardFull($('#fCard'));
  if (!P) { $('#fTbl').innerHTML = '<div class="empty">لا توجد خطط.</div>'; $('#fKpi').hidden = true; return; }

  if (!isR && (P.student_execution === 'none' || !tasksE.length)) { $('#fKpi').hidden = true; $('#fTbl').innerHTML = '<div class="empty">هذه الخطة بلا تنفيذ عند الطالب. اختر خطة فيها واجب يعلّم عليه الطالب.</div>'; return; }
  const studs = actives().filter(s => s.assign?.plan_id === P.id);
  if (FOL.mode === 'cal') return renderCal(el, P, isR ? 'rec' : 'exe', studs, title);
  const { data: lv } = await db.from('leave_requests').select('student_id, date_from, date_to').eq('status', 'approved').lte('date_from', FOL.mode === 'day' ? day : to).gte('date_to', FOL.mode === 'day' ? day : from);
  const leaveOn = (sid, d) => (lv || []).some(l => l.student_id === sid && l.date_from <= d && l.date_to >= d) || !!A.holdOn(D.studentById[sid]?.assign, d);
  const base = s => ({ s, name: s.name, email: s.email || '', teacher: s.teacher, room: s.room });
  const kpi = items => { $('#fKpi').innerHTML = `<div class="minis">${items.map(([l, v, c]) => mini(l, fmtNum(v), c)).join('')}</div>`; };
  const pctColor = v => v == null ? '' : v >= 90 ? 'var(--green)' : v >= 70 ? 'var(--teal)' : v >= 50 ? '#9A6A08' : 'var(--red)';
  const pctHtml = v => v == null ? '—' : `<b style="color:${pctColor(v)}">${v}٪</b>`;
  let tbl, expCols;
  // زر «رصد إجراء» آخر كل صف
  const actCol = { key: '_ac', label: '', html: r => `<button class="btn sm ghost" type="button" data-act="${r.s.id}">رصد إجراء</button>` };
  const dtA = (box, o) => dataTable(box, { ...o, cols: [...o.cols, actCol] });
  $('#fTbl').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) actionPopup(D.studentById[b.dataset.act], isR ? 'rec' : 'exec', P); });

  if (isR && FOL.mode === 'day') {
    // ===== التسميع: يوم واحد =====
    const tasks = A.groupTasks(P.cols, c => c.executor === 'teacher' || c.executor === 'both');
    const work = isWork(P, day), recD = A.isRecitationDay(P, day);
    const ST = { done: 'سمّع', makeup: 'عوّض', review: 'ربط ومراجعة', excused: 'مستأذن', absent: 'غائب', none: 'لم يُرصد', off: 'ليس يوم تسميع' };
    const rows = studs.map(s => {
      const rs = (D.recsByStudent[s.id] || []).filter(r => r.rec_date === day && r.plan_id === P.id);
      const r = rs[0];
      let k = !r ? (leaveOn(s.id, day) ? 'excused' : recD ? 'none' : 'off') : r.status === 'present' ? 'done' : r.status === 'makeup' ? 'makeup' : r.status === 'review_only' ? 'review' : r.status;
      const o = { ...base(s), r, k, state: ST[k], pday: A.planDayFor(s.assign, P, Object.keys(P.days).length, day), score: r?.score != null ? +r.score : null, notes: r?.notes || '' };
      tasks.forEach(t => { const v = r ? A.fmtTaskVal(t, r.vals) : null; o['t_' + t.key] = v ? v.replace(/^من (?:[^\d\s؟]+ )?(.+?) إلى (?:[^\d\s؟]+ )?(.+)$/, '$1–$2') : ''; });
      return o;

    const n = k => rows.filter(r => r.k === k).length;
    kpi([['طلاب الخطة', rows.length, 'slate'], ['سمّع', n('done'), 'green'], ['عوّض', n('makeup'), 'amber'], ['ربط ومراجعة', n('review'), 'blue'], ['مستأذن', n('excused'), 'violet'], ['لم يُرصد', n('none'), 'red']]);
    $('#fTitle').textContent = 'حالة التسميع لكل طالب';
    $('#fHint').textContent = !work ? 'هذا اليوم ليس من أيام الخطة.' : !recD ? 'هذا اليوم ليس من أيام التسميع في الخطة.' : 'اضغط على الطالب لملفه وتقاريره، و«رصد» لرصد طالب لم يُرصد.';
    const pill = { done: 'ok', makeup: 'gold', review: 'info', excused: 'violet', absent: 'bad', none: 'bad', off: 'plain' };
    tbl = dtA($('#fTbl'), { rows, sortKey: 'state', pageSize: 300, onRow: r => studentFile(r.s.id), cols: [
      { key: 'name', label: 'الطالب' }, { key: 'teacher', label: 'المعلم', filter: true }, { key: 'room', label: 'الفترة', filter: true }, { key: 'pday', label: 'يوم الخطة', num: true },
      { key: 'state', label: 'الحالة', filter: true, html: x => `<span class="pill ${pill[x.k]}">${x.state}</span>` },
      ...tasks.map(t => ({ key: 't_' + t.key, label: t.name, html: x => x['t_' + t.key] ? esc(x['t_' + t.key]) : '<span class="muted">—</span>' })),
      { key: 'score', label: 'الدرجة', num: true, html: x => x.score == null ? '—' : fmtNum(x.score, 2) }, { key: 'notes', label: 'ملاحظات' },
      { key: 'act', label: '', html: x => `<button class="btn ${x.r ? 'ghost' : ''} sm" data-rec="${x.s.id}">${x.r ? 'عرض' : 'رصد'}</button>` }],
      after: root => $$('[data-rec]', root).forEach(b => b.onclick = () => adminRecord(b.dataset.rec)) });
    expCols = [['التاريخ', () => day], ['الطالب', x => x.name], ['البريد', x => x.email], ['المعلم', x => x.teacher], ['الفترة', x => x.room], ['يوم الخطة', x => x.pday], ['الحالة', x => x.state], ...taskExpCols(tasks, x => x.r?.vals), ['الدرجة', x => x.score], ['ملاحظات', x => x.notes]];
  }

  else if (isR) {
    // ===== التسميع: فترة (مثل «لوحة متابعة إنجاز الطلاب حسب الفترة») =====
    const R = P.discipline_rules || {};
    const dates = datesBetween(from, to).filter(d => A.isRecitationDay(P, d));
    const rows = studs.map(s => {
      const start = [s.assign.start_date, s.join_date].filter(Boolean).sort().pop();
      const my = dates.filter(d => d >= start);
      const rs = (D.recsByStudent[s.id] || []).filter(r => r.plan_id === P.id && r.rec_date >= from && r.rec_date <= to);
      const day = st => new Set(rs.filter(r => st.includes(r.status)).map(r => r.rec_date));
      const done = day(['present']), mk = day(['makeup']), rev = day(['review_only']), exc = day(['excused']);
      my.forEach(d => { if (leaveOn(s.id, d)) exc.add(d); });
      rs.filter(r => r.status === 'makeup' && r.makes_up_date).forEach(r => done.add(r.makes_up_date));
      const covered = new Set([...done, ...rev, ...exc, ...mk]);
      const behind = my.filter(d => !covered.has(d) && d < TODAY).length;
      const baseN = my.filter(d => d < TODAY || covered.has(d)).length - exc.size;
      const pct = baseN > 0 ? Math.min(100, Math.round((done.size + mk.size + rev.size) / baseN * 100)) : null;
      const follow = R.warning_after && behind >= R.warning_after ? 'إنذار مستحق' : R.alert_after && behind >= R.alert_after ? 'تنبيه مستحق' : behind ? 'متأخر' : 'منتظم';
      return { ...base(s), days: my.length, done: done.size, makeup: mk.size, review: rev.size, excused: exc.size, behind, pct, follow, last: (D.recsByStudent[s.id] || [])[0]?.rec_date || null };
    });
    const sum = k => rows.reduce((a, r) => a + r[k], 0);
    kpi([['طلاب الخطة', rows.length, 'slate'], ['أيام التسميع في الفترة', dates.length, 'teal'], ['منجز', sum('done'), 'green'], ['تعويض', sum('makeup'), 'amber'], ['ربط ومراجعة', sum('review'), 'blue'], ['مستأذن', sum('excused'), 'violet'], ['متخلّف', sum('behind'), 'red']]);
    $('#fTitle').textContent = 'متابعة التسميع للفترة';
    $('#fHint').textContent = `${A.greg(from)} – ${A.greg(to)} · «متخلّف» يوم تسميع مضى بلا رصد ولا استئذان ولا تعويض`;
    const fp = { 'منتظم': 'ok', 'متأخر': 'warn', 'تنبيه مستحق': 'warn', 'إنذار مستحق': 'bad' };
    tbl = dtA($('#fTbl'), { rows, sortKey: 'behind', dir: -1, pageSize: 300, onRow: r => studentFile(r.s.id), cols: [
      { key: 'name', label: 'الطالب' }, { key: 'teacher', label: 'المعلم', filter: true }, { key: 'room', label: 'الفترة', filter: true },
      { key: 'days', label: 'أيام التسميع', num: true }, { key: 'done', label: 'منجز', num: true }, { key: 'makeup', label: 'تعويض', num: true }, { key: 'review', label: 'ربط ومراجعة', num: true }, { key: 'excused', label: 'مستأذن', num: true },
      { key: 'behind', label: 'متخلّف', num: true, html: x => x.behind ? `<b style="color:var(--red)">${x.behind}</b>` : '0' }, { key: 'pct', label: 'نسبة الإنجاز', num: true, html: x => pctHtml(x.pct) },
      { key: 'follow', label: 'المتابعة', filter: true, html: x => `<span class="pill ${fp[x.follow]}">${x.follow}</span>` }, { key: 'last', label: 'آخر رصد', html: x => x.last ? A.greg(x.last) : '—' }] });
    expCols = [['الطالب', x => x.name], ['البريد', x => x.email], ['المعلم', x => x.teacher], ['الفترة', x => x.room], ['أيام التسميع', x => x.days], ['منجز', x => x.done], ['تعويض', x => x.makeup], ['ربط ومراجعة', x => x.review], ['مستأذن', x => x.excused], ['متخلّف', x => x.behind], ['نسبة الإنجاز ٪', x => x.pct], ['المتابعة', x => x.follow], ['آخر رصد', x => x.last]];
  }

  else if (FOL.mode === 'day') {
    // ===== الواجب: يوم واحد — مهام يوم الخطة لكل طالب =====
    const prog = await planProgress(P.id);
    const nDays = Object.keys(P.days).length, work = isWork(P, day);
    const rows = studs.map(s => {
      const dn = A.planDayFor(s.assign, P, nDays, day), dv = P.days[dn]?.vals || {}, done = prog[s.id]?.[dn] || new Set();
      const o = { ...base(s), pday: dn };
      let need = 0, ok = 0;
      tasksE.forEach(t => { const req = A.fmtTaskVal(t, dv) != null; const d = t.cols.some(c => done.has(c.id)); o['t_' + t.key] = !req ? '' : d ? '✓' : '✗'; if (req) { need++; if (d) ok++; } });
      const wx = A.dayExec(eTasks, dv, done); o.pct = wx ? Math.round(wx.ratio * 100) : null; // النسبة بأوزان الأعمدة
      o.k = !work ? 'off' : leaveOn(s.id, day) ? 'excused' : !need ? 'off' : ok === need ? 'full' : ok ? 'part' : 'none';
      o.state = { off: 'لا واجب', excused: 'مستأذن', full: 'أنجز الواجب', part: 'أنجز جزءًا', none: 'لم ينفّذ' }[o.k];
      return o;
    });
    const n = k => rows.filter(r => r.k === k).length;
    kpi([['طلاب الخطة', rows.length, 'slate'], ['أنجز الواجب', n('full'), 'green'], ['أنجز جزءًا', n('part'), 'amber'], ['لم ينفّذ', n('none'), 'red'], ['مستأذن', n('excused'), 'violet']]);
    $('#fTitle').textContent = 'تنفيذ الواجب لكل طالب';
    $('#fHint').textContent = work ? 'الواجب = مهام يوم الخطة التي يعلّم عليها الطالب. ✓ أنجزها، ✗ لم يعلّم عليها.' : 'هذا اليوم ليس من أيام الخطة.';
    const pill = { full: 'ok', part: 'warn', none: 'bad', excused: 'violet', off: 'plain' };
    tbl = dtA($('#fTbl'), { rows, sortKey: 'state', pageSize: 300, onRow: r => studentFile(r.s.id), cols: [
      { key: 'name', label: 'الطالب' }, { key: 'teacher', label: 'المعلم', filter: true }, { key: 'room', label: 'الفترة', filter: true }, { key: 'pday', label: 'يوم الخطة', num: true },
      ...tasksE.map(t => ({ key: 't_' + t.key, label: t.name, filter: true, html: x => x['t_' + t.key] === '✓' ? '<b style="color:var(--green)">✓</b>' : x['t_' + t.key] === '✗' ? '<b style="color:var(--red)">✗</b>' : '<span class="muted">—</span>' })),
      { key: 'pct', label: 'الإنجاز', num: true, html: x => pctHtml(x.pct) }, { key: 'state', label: 'الحالة', filter: true, html: x => `<span class="pill ${pill[x.k]}">${x.state}</span>` }] });
    expCols = [['التاريخ', () => day], ['الطالب', x => x.name], ['البريد', x => x.email], ['المعلم', x => x.teacher], ['الفترة', x => x.room], ['يوم الخطة', x => x.pday], ...tasksE.map(t => [t.name, x => x['t_' + t.key]]), ['الإنجاز ٪', x => x.pct], ['الحالة', x => x.state]];
  }

  else {
    // ===== الواجب: فترة =====
    const prog = await planProgress(P.id);
    const nDays = Object.keys(P.days).length;
    const dates = datesBetween(from, to).filter(d => isWork(P, d) && d < TODAY);
    const rows = studs.map(s => {
      const start = [s.assign.start_date, s.join_date].filter(Boolean).sort().pop();
      let full = 0, part = 0, none = 0, exc = 0, need = 0, ok = 0, streak = 0, cur = 0;
      dates.filter(d => d >= start).forEach(d => {
        if (leaveOn(s.id, d)) { exc++; return; }

        let n = 0, k = 0; tasksE.forEach(t => { if (A.fmtTaskVal(t, dv) == null) return; n++; if (t.cols.some(c => done.has(c.id))) k++; });
        if (!n) return;

      });
      const days = full + part + none;
      return { ...base(s), days, full, part, none, exc, pct: need ? Math.round(ok / need * 100) : null, streak, follow: none >= 3 && !full ? 'لا ينفّذ' : streak >= 3 ? 'متقطع' : 'منتظم' };
    });
    const sum = k => rows.reduce((a, r) => a + r[k], 0);
    kpi([['طلاب الخطة', rows.length, 'slate'], ['أيام الخطة في الفترة', dates.length, 'teal'], ['أيام مكتملة', sum('full'), 'green'], ['أيام جزئية', sum('part'), 'amber'], ['أيام بلا تنفيذ', sum('none'), 'red'], ['أيام استئذان', sum('exc'), 'violet']]);
    $('#fTitle').textContent = 'متابعة الواجب للفترة';
    $('#fHint').textContent = `${A.greg(from)} – ${A.greg(to)} · حتى أمس`;

    tbl = dtA($('#fTbl'), { rows, sortKey: 'pct', dir: 1, pageSize: 300, onRow: r => studentFile(r.s.id), cols: [
      { key: 'name', label: 'الطالب' }, { key: 'teacher', label: 'المعلم', filter: true }, { key: 'room', label: 'الفترة', filter: true },
      { key: 'days', label: 'أيام الواجب', num: true }, { key: 'full', label: 'مكتمل', num: true }, { key: 'part', label: 'جزئي', num: true }, { key: 'none', label: 'لم ينفّذ', num: true, html: x => x.none ? `<b style="color:var(--red)">${x.none}</b>` : '0' }, { key: 'exc', label: 'مستأذن', num: true },
      { key: 'streak', label: 'أطول انقطاع', num: true, html: x => x.streak ? x.streak + ' يوم' : '—' }, { key: 'pct', label: 'نسبة التنفيذ', num: true, html: x => pctHtml(x.pct) },
      { key: 'follow', label: 'المتابعة', filter: true, html: x => `<span class="pill ${fp[x.follow]}">${x.follow}</span>` }] });
    expCols = [['الطالب', x => x.name], ['البريد', x => x.email], ['المعلم', x => x.teacher], ['الفترة', x => x.room], ['أيام الواجب', x => x.days], ['مكتمل', x => x.full], ['جزئي', x => x.part], ['لم ينفّذ', x => x.none], ['مستأذن', x => x.exc], ['أطول انقطاع', x => x.streak], ['نسبة التنفيذ ٪', x => x.pct], ['المتابعة', x => x.follow]];
  }
  $('#fExport').onclick = () => A.exportXlsx(`${title} - ${P.name} - ${FOL.mode === 'day' ? day : from + ' إلى ' + to}`, title, expCols, tbl.getRows());
}

let PLANS_FULL = null;
async function plansFull() { if (!PLANS_FULL) PLANS_FULL = await A.loadPlansFull(D.plans.map(p => p.id)); return PLANS_FULL; }
async function adminRecord(stuId, editId) {
  const PL = await plansFull();
  const s = D.studentById[stuId]; if (!s) return;
  const a = s.assign;
  drawer((editId ? 'تعديل رصد: ' : 'رصد: ') + s.name, '<div id="spAdm"></div><div id="rwAdm"></div>', root => {
    A.studentPanel($('#spAdm', root), s, a, a ? PL[a.plan_id] : null);
    A.recordWidget($('#rwAdm', root), { stu: s, assign: a, P: a ? PL[a.plan_id] : null, roomId: D.roomOfStudent[s.id] || null, roomName: s.room !== '—' ? s.room : '',
      teacherId: s.teacher_id || D.teachers.find(t => !t.is_archived)?.id, teachers: D.teachers.filter(t => !t.is_archived).map(t => ({ id: t.id, name: t.name })),
      meId: me.id, canEdit: () => true, canDelete: true, teacherName: id => D.teacherById[id]?.name || '', layout: 'stack', editId,
      onDelete: (r, done) => cancelRec(r.id, done), onSaved: async () => { await loadRecs(true); if (current === 'recs' || current === 'srecs') route(); } });
  });
}
function pickStudentThenRecord() {
  drawer('رصد جلسة تسميع', `<label class="f" for="psQ">اختر الطالب<input id="psQ" type="search" placeholder="اكتب اسم الطالب أو بريده…" autocomplete="off"></label><div class="stack" id="psList" style="gap:4px"></div>`, root => {
    const draw = () => { const t = norm($('#psQ', root).value); const list = actives().filter(s => !t || norm(s.name + ' ' + (s.email || '')).includes(t)).sort((a, b) => a.name.localeCompare(b.name, 'ar')).slice(0, 40);
      $('#psList', root).innerHTML = list.map(s => `<button type="button" class="btn ghost" data-ps="${s.id}" style="justify-content:space-between;width:100%"><span>${esc(s.name)}</span><span class="hint">${esc(s.teacher)} · ${esc(s.room)}</span></button>`).join('') || '<div class="empty">لا يوجد</div>';
      $$('[data-ps]', root).forEach(b => b.onclick = () => adminRecord(b.dataset.ps)); };
    $('#psQ', root).addEventListener('input', draw); draw(); $('#psQ', root).focus();

const toWestern = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g, '.');

function parseDate(v) {

  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if (typeof v === 'number' && v > 1000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + v * 864e5); return d.toISOString().slice(0, 10); }
  const s = toWestern(v).trim();

// التنفيذ: مهام الطالب التي علّم عليها ÷ مهامه المطلوبة في أيام الخطة المنقضية
async function loadPlanData(force) {
  if (D.planCols && !force) return;
  const [c, d, p] = await Promise.all([
    fetchAll(() => db.from('plan_columns').select('*').order('seq')),
    fetchAll(() => db.from('plan_days').select('id, plan_id, day_number, vals')),
    fetchAll(() => db.from('plan_progress').select('student_id, plan_day_id, column_id'))
  ]);
  D.planCols = {}; c.forEach(x => (D.planCols[x.plan_id] ||= []).push(x));
  D.planDays = {}; d.forEach(x => ((D.planDays[x.plan_id] ||= {})[x.day_number] = x));
  D.progByStu = {}; p.forEach(x => (D.progByStu[x.student_id] ||= new Set()).add(x.plan_day_id + '|' + x.column_id));
}
function execOf(s) {
  const P = s.planObj; if (!P || P.student_execution === 'none' || !D.planDays) return null;
  const days = D.planDays[P.id] || {}, n = Object.keys(days).length;
  const cur = A.planDayFor(s.assign, P, n, A.addDays(TODAY, -1));
  const tasks = A.execTasks({ ...P, cols: D.planCols[P.id] || [] });
  const prog = D.progByStu[s.id] || new Set();
  let sum = 0, n2 = 0;
  for (let k = s.assign.start_day; k <= cur; k++) { const day = days[k]; if (!day) continue; const done = new Set(tasks.flatMap(t => t.cols).filter(c => prog.has(day.id + '|' + c.id)).map(c => c.id)); const r = A.dayExec(tasks, day.vals, done); if (!r) continue; sum += r.ratio; n2++; }
  return n2 ? Math.round(sum / n2 * 100) : null;
}
// التقييم المركب حسب أوزان الخطة
function evalOf(s, st, ex) {
  const P = s.planObj; if (!P) return null;
  const max = +(P.score_rules?.max || 10);
  const rec = P.recitation_mode !== 'none' && st.avg != null ? st.avg / max * 100 : null;
  if (P.student_execution === 'counts' && P.recitation_mode !== 'none') {
    if (rec == null || ex == null || P.execution_weight == null || P.recitation_weight == null) return null;
    return (rec * P.recitation_weight + ex * P.execution_weight) / 100;
  }
  if (P.student_execution === 'counts') return ex;
  return rec;
}

async function archiveStudent(s) {
  const to = !s.is_archived;
  const ok = await confirmBox(to ? `أرشفة «${s.name}»؟ لن يظهر للمعلمين، وتتوقف صفحته عن العمل. تبقى سجلاته كاملة، ويمكن استعادته لاحقًا.` : `استعادة «${s.name}» من الأرشيف؟`, to ? 'أرشفة' : 'استعادة', to);
  if (!ok) return;
  const { error } = await db.from('students').update({ is_archived: to }).eq('id', s.id);
  if (error) return toast(error.message, true);
  toast(to ? 'أُرشف الطالب' : 'استُعيد الطالب'); await loadCore(); route();
}

          const r = await db.from('students').update(row).eq('id', sid); if (r.error) throw r.error;

        await db.from('users').update({ phone }).eq('id', uid);
        if (val('sfIdN') || val('sfIdT') || priv.student_id) { const r = await db.from('student_private').upsert({ student_id: sid, id_number: val('sfIdN') || null, id_type: val('sfIdT') || null, updated_at: new Date().toISOString() }); if (r.error) throw r.error; }

          if (rId) { const room = D.roomById[rId]; const used = D.ra.filter(x => x.room_id === rId && x.assignee_type === 'student').length; if (room.capacity && used >= room.capacity) throw new Error('اكتملت سعة الفترة «' + room.name + '»'); r = await db.from('room_assignments').insert({ room_id: rId, assignee_type: 'student', assignee_id: sid }); if (r.error) throw r.error; }
        }
        const pId = val('sfP') || null, sd = val('sfPS') || TODAY, sday = Math.max(1, +val('sfPD') || 1);

        }

      rd.onload = () => {
        try {
          const wb = csv ? XLSX.read(String(rd.result).replace(/^﻿/, ''), { type: 'string' }) : XLSX.read(rd.result, { type: 'array', cellDates: true });
          const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: true });
          previewImport(root, f.name, aoa);
        } catch (err) { toast('تعذّرت قراءة الملف: ' + err.message, true); }
      };
      if (csv) rd.readAsText(f, 'UTF-8'); else rd.readAsArrayBuffer(f);

}
function previewImport(root, fileName, aoa) {
  const hi = aoa.findIndex(r => r.some(x => String(x).trim() !== ''));
  const heads = (aoa[hi] || []).map(h => norm(h));
  const map = {};
  IMPORT_FIELDS.forEach(f => { const i = heads.findIndex(h => [f.label, ...f.alt].map(norm).includes(h)); if (i >= 0) map[f.key] = i; });
  const missingReq = IMPORT_FIELDS.filter(f => f.req && map[f.key] == null).map(f => f.label);
  const existing = new Set(D.users.map(u => (u.email || '').toLowerCase()));
  const seen = new Set();
  const rows = aoa.slice(hi + 1).filter(r => r.some(x => String(x).trim() !== '')).map((r, i) => {
    const g = k => map[k] == null ? '' : r[map[k]];
    const x = { line: hi + i + 2, name: String(g('name')).trim(), email: String(g('email')).trim().toLowerCase(), phone: toWestern(g('phone')).replace(/\s+/g, '').trim(),
      nationality: String(g('nationality')).trim(), residence: String(g('residence')).trim(), gender: String(g('gender')).trim(), id_number: toWestern(g('id_number')).trim(),
      id_type: String(g('id_type')).trim(), birth_date: parseDate(g('birth_date')), education: String(g('education')).trim(), quran_parts: parseParts(g('quran_parts')), errors: [] };
    if (!x.name) x.errors.push('الاسم فارغ');
    if (!x.email) x.errors.push('البريد فارغ'); else if (!EMAIL_RE.test(x.email)) x.errors.push('بريد غير صالح');
    if (!x.phone) x.errors.push('الجوال فارغ');
    if (x.email && seen.has(x.email)) x.errors.push('البريد مكرر في الملف'); seen.add(x.email);
    if (g('birth_date') !== '' && !x.birth_date) x.errors.push('تاريخ ميلاد غير مفهوم');
    x.exists = existing.has(x.email);
    return x;
  });
  const ok = rows.filter(r => !r.errors.length && !r.exists);
  const area = $('#impArea', root);
  area.innerHTML = `<div class="${missingReq.length || rows.some(r => r.errors.length) ? 'error' : 'okbox'}"><b>${esc(fileName)}</b>: ${rows.length} صف.
      ${missingReq.length ? `<br>أعمدة إلزامية غير موجودة: ${missingReq.join('، ')}.` : ''}
      <br>سيُستورد: <b>${ok.length}</b> · فيه أخطاء: <b>${rows.filter(r => r.errors.length).length}</b> · مسجل مسبقًا (يُتجاهل): <b>${rows.filter(r => r.exists && !r.errors.length).length}</b></div>
    <div class="tbl-wrap" style="max-height:300px"><table><thead><tr><th>السطر</th><th>الاسم</th><th>البريد</th><th>الجوال</th><th>الجنسية</th><th>حفظ القرآن</th><th>الحالة</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="num">${r.line}</td><td>${esc(r.name)}</td><td dir="ltr">${esc(r.email)}</td><td dir="ltr">${esc(r.phone)}</td><td>${esc(r.nationality)}</td><td class="num">${r.quran_parts ?? '—'}</td><td>${r.errors.length ? `<span class="pill bad">${esc(r.errors.join('، '))}</span>` : r.exists ? '<span class="pill plain">مسجل مسبقًا</span>' : '<span class="pill ok">جاهز</span>'}</td></tr>`).join('')}</tbody></table></div>
    <div class="card c-blue"><h3>إسناد اختياري لكل المستوردين</h3><div class="g2" style="margin-top:8px">
      <label class="f" for="iProg">البرنامج<select id="iProg"><option value="">—</option>${D.programs.map(p => opt(p.id, p.name)).join('')}</select></label>
      <label class="f" for="iT">المعلم<select id="iT"><option value="">—</option>${teacherOpts()}</select></label>
      <label class="f" for="iR">الفترة<select id="iR"><option value="">—</option>${roomOpts()}</select></label>
      <label class="f" for="iP">الخطة<select id="iP"><option value="">—</option>${planOpts()}</select></label>
      <label class="f" for="iPS">تاريخ بداية الخطة<input id="iPS" type="date" value="${TODAY}"></label>
      <label class="f" for="iPD">من يوم الخطة رقم<input id="iPD" type="number" min="1" value="1"></label></div></div>
    <p class="hint">لكل طالب كلمة مرور عشوائية. بعد الاستيراد نزّل ملف كلمات المرور وأرسلها للطلاب بطريقة آمنة.</p>
    <button class="btn" id="impGo" ${ok.length && !missingReq.length ? '' : 'disabled'}>استيراد ${ok.length} طالب</button><div id="impRes"></div>`;
  $('#impGo', root).onclick = async () => {
    const b = $('#impGo', root); b.disabled = true;
    const opts = { prog: $('#iProg', root).value || null, t: $('#iT', root).value || null, r: $('#iR', root).value || null, p: $('#iP', root).value || null, ps: $('#iPS', root).value || TODAY, pd: Math.max(1, +$('#iPD', root).value || 1) };
    const results = [];
    let roomUsed = opts.r ? D.ra.filter(x => x.room_id === opts.r && x.assignee_type === 'student').length : 0;
    const cap = opts.r ? D.roomById[opts.r].capacity : null;
    for (let i = 0; i < ok.length; i++) {
      const x = ok[i]; b.textContent = `جارٍ الاستيراد ${i + 1} من ${ok.length}…`;
      const pw = genPw();
      try {
        const { data: uid, error } = await db.rpc('admin_create_account', { p_email: x.email, p_name: x.name, p_role: 'student', p_password: pw }); if (error) throw error;
        await db.from('users').update({ phone: x.phone }).eq('id', uid);
        const r = await db.from('students').insert({ user_id: uid, program_id: opts.prog, teacher_id: opts.t, phone: x.phone, gender: x.gender || null, nationality: x.nationality || null, residence: x.residence || null, birth_date: x.birth_date, education: x.education || null, quran_parts: x.quran_parts, app_status: 'مقبول' }).select('id').single();
        if (r.error) throw r.error;
        const sid = r.data.id;
        if (x.id_number || x.id_type) await db.from('student_private').insert({ student_id: sid, id_number: x.id_number || null, id_type: x.id_type || null });
        let note = '';
        if (opts.r) { if (cap && roomUsed >= cap) note = 'الفترة ممتلئة، لم يُسند لها'; else { await db.from('room_assignments').insert({ room_id: opts.r, assignee_type: 'student', assignee_id: sid }); roomUsed++; } }
        if (opts.p) await db.from('plan_assignments').insert({ plan_id: opts.p, student_id: sid, start_date: opts.ps, start_day: opts.pd, assigned_by: me.id });
        results.push({ ...x, pw, ok: true, note });
      } catch (e) { results.push({ ...x, ok: false, note: e.message }); }
    }
    await loadCore(); route();
    b.textContent = 'تم الاستيراد';
    const good = results.filter(r => r.ok);
    $('#impRes', root).innerHTML = `<div class="${results.some(r => !r.ok) ? 'error' : 'okbox'}" style="margin-top:8px">استُورد ${good.length} من ${results.length}.${results.filter(r => !r.ok).map(r => `<br>${esc(r.name)}: ${esc(r.note)}`).join('')}${good.filter(r => r.note).map(r => `<br>${esc(r.name)}: ${esc(r.note)}`).join('')}</div>
      <button class="btn gold" id="pwDl" style="margin-top:8px">تنزيل ملف كلمات المرور</button>`;
    $('#pwDl', root).onclick = () => { const ws = XLSX.utils.aoa_to_sheet([['الاسم', 'البريد الإلكتروني', 'كلمة المرور', 'رابط الدخول'], ...good.map(r => [r.name, r.email, r.pw, location.href.replace(/admin\.html.*$/, 'index.html')])]); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'كلمات المرور'); XLSX.writeFile(wb, 'كلمات مرور الطلاب المستوردين.xlsx'); };
  };
}

async function studentFile(id) {
  await loadRecs();
  const s = D.studentById[id]; if (!s) return;
  const st = statsOf(s);
  const recs = (D.recsByStudent[id] || []).slice(0, 15);
  const PL = await plansFull(), P = s.assign ? PL[s.assign.plan_id] : null;

// ============ الإشعارات: كل رسالة تُسجَّل لكل قناة، وتُرسل البريد والجوال لاحقًا دالة خادم ============
async function notify(userIds, kind, title, body, channels, dedupe) {
  const rows = [];
  userIds.forEach(u => channels.forEach(ch => rows.push({ recipient_user_id: u, channel: ch, kind, title, body, created_by: me.id, status: ch === 'inbox' ? 'sent' : 'queued', sent_at: ch === 'inbox' ? new Date().toISOString() : null, dedupe_key: dedupe ? `${dedupe}:${u}:${ch}` : null })));
  for (let i = 0; i < rows.length; i += 500) { const { error } = await db.from('notifications').upsert(rows.slice(i, i + 500), { onConflict: 'dedupe_key', ignoreDuplicates: true }); if (error) throw error; }
  // إرسال إشعارات الجوال فورًا (ودالة الخادم تعيد المحاولة كل دقيقة أيضًا)
  if (channels.includes('push')) db.functions.invoke('send-push', { body: {} }).catch(() => {});
  return rows.length;
}

// إسناد الطلاب للغرفة: نفس طريقة إسناد الخطة (بحث وتحديد متعدد، ومن في غرفة أخرى يظهر رماديًا)
function roomStudents(room) {
  const studs = D.students.filter(s => !s.is_archived).map(s => ({ s, here: D.roomOfStudent[s.id] === room.id, other: D.roomOfStudent[s.id] && D.roomOfStudent[s.id] !== room.id, key: norm(s.name + ' ' + (s.email || '') + ' ' + (s.quran_parts ?? '')) }))
    .sort((x, y) => (y.here - x.here) || (x.other - y.other) || x.s.name.localeCompare(y.s.name, 'ar'));
  const sel = new Set(studs.filter(x => x.here).map(x => x.s.id)), before = new Set(sel);
  let q = '';
  drawer('طلاب ' + room.name, `<div class="row"><span class="small">السعة: ${room.capacity ?? 'غير محددة'} · ${(room.start_time || '').slice(0, 5)}–${(room.end_time || '').slice(0, 5)}</span><span class="pill gold" id="rsCount"></span></div>
    <input type="search" id="rsQ" placeholder="بحث بالاسم أو البريد…" autocomplete="off">
    <p class="hint">الطالب الرمادي مسند لغرفة أخرى (يظهر اسمها). اختياره هنا ينقله لهذه الغرفة.</p>
    <div class="tbl-wrap" style="max-height:55vh"><table><thead><tr><th></th><th>الطالب</th><th>المعلم</th><th>غرفته الحالية</th></tr></thead><tbody id="rsBody"></tbody></table></div>
    <button class="btn" id="rsSave">حفظ</button>`, root => {
    const draw = () => {
      const vis = studs.filter(x => !q || x.key.includes(q));
      $('#rsBody', root).innerHTML = vis.map(x => `<tr${x.other && !sel.has(x.s.id) ? ' style="opacity:.55;background:var(--track)"' : ''}><td><input type="checkbox" data-s="${x.s.id}"${sel.has(x.s.id) ? ' checked' : ''} aria-label="${esc(x.s.name)}"></td><td style="white-space:normal"><b>${esc(x.s.name)}</b></td><td>${esc(x.s.teacher)}</td><td>${x.here ? '<span class="pill ok">هذه الغرفة</span>' : x.other ? `<span class="pill plain">${esc(D.roomById[D.roomOfStudent[x.s.id]]?.name || '')}</span>` : '—'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">لا توجد نتائج</td></tr>';
      $$('[data-s]', root).forEach(c => c.onchange = () => { c.checked ? sel.add(c.dataset.s) : sel.delete(c.dataset.s); count(); draw(); });
      count();
    };
    const count = () => { const add = [...sel].filter(i => !before.has(i)).length, rem = [...before].filter(i => !sel.has(i)).length; $('#rsCount', root).textContent = `${sel.size}${room.capacity ? ' / ' + room.capacity : ''} · +${add} −${rem}`; };
    $('#rsQ', root).addEventListener('input', e => { q = norm(e.target.value); draw(); });
    draw();
    $('#rsSave', root).onclick = async () => {
      if (room.capacity && sel.size > room.capacity) return toast(`المحدد ${sel.size} أكثر من سعة الغرفة (${room.capacity})`, true);
      const add = [...sel].filter(i => !before.has(i)), rem = [...before].filter(i => !sel.has(i));
      const moveIds = [...rem, ...add];
      if (moveIds.length) { const r = await db.from('room_assignments').delete().eq('assignee_type', 'student').in('assignee_id', moveIds); if (r.error) return toast(r.error.message, true); }
      if (add.length) { const r = await db.from('room_assignments').insert(add.map(i => ({ room_id: room.id, assignee_type: 'student', assignee_id: i }))); if (r.error) return toast(r.error.message, true); }
      toast(`حُفظ: أُضيف ${add.length} وأُزيل ${rem.length}`); closeDrawer(); await loadCore(); route();
    };
  });
}

      if (error) return toast(error.message, true); toast('حُفظت الفترة'); closeDrawer(); await loadCore(); route();
    };

  });
}

// ============ التقرير الإجمالي: صف لكل طالب ============
// الحفظ/الربط/المراجعة/التكرار: من تنفيذ الطالب إن كانت الخطة فيها تنفيذ له، وإلا من رصد المعلم.
// التسميع: مجموع ما سمّعه الطالب للمعلم. الالتزام يُحسب حسب نوع الخطة.
const SUM_ST = { preset: 'all', from: '', to: TODAY, plan: '', teacher: '', room: '', nat: '' };
const rangeLen = (a, b) => (a == null || b == null || a === '' || b === '' || a === false || b === false || !+a || !+b) ? 0 : Math.abs(+b - +a) + 1;
SECTIONS.summary = async el => {
  await loadRecs();
  const PL = await plansFull();
  const st = SUM_ST;
  const first = D.recs.length ? D.recs[D.recs.length - 1].rec_date : TODAY;
  if (st.preset === 'all') { st.from = first; st.to = TODAY; }
  else if (st.preset === 'month') { st.from = TODAY.slice(0, 8) + '01'; st.to = TODAY; }
  else if (st.preset === '30') { st.from = A.addDays(TODAY, -29); st.to = TODAY; }
  else if (st.preset === 'week') { st.from = A.addDays(TODAY, -A.dowMakkah()); st.to = TODAY; }
  const from = st.from, to = [st.to, TODAY].sort()[0];
  const uniq = k => [...new Set(D.students.map(s => s[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ar'));
  const studs = actives().filter(s => s.assign && PL[s.assign.plan_id] && (!st.plan || s.assign.plan_id === st.plan) && (!st.teacher || s.teacher_id === st.teacher) && (!st.room || D.roomOfStudent[s.id] === st.room) && (!st.nat || s.nationality === st.nat));
  el.innerHTML = `${secHead('التقرير الإجمالي للطلاب', A.greg(from) + ' – ' + A.greg(to), 'gold', `<button class="btn ghost sm" id="sExport">تصدير إلى إكسل</button>`)}
    <div class="card" style="--a:var(--gold);margin-bottom:10px"><div class="tbl-tools" style="margin:0">
      <div class="seg">${[['week', 'هذا الأسبوع'], ['month', 'هذا الشهر'], ['30', 'آخر 30 يومًا'], ['all', 'منذ البداية'], ['custom', 'مخصص']].map(([k, l]) => `<button type="button" data-sp="${k}" aria-pressed="${st.preset === k}">${l}</button>`).join('')}</div>
      <input type="date" id="sF" value="${from}" style="width:auto"><input type="date" id="sT" value="${st.to}" style="width:auto">
      <select id="sPl" style="width:auto"><option value="">كل البرامج</option>${planOpts(st.plan)}</select>
      <select id="sTe" style="width:auto"><option value="">كل المعلمين</option>${teacherOpts(st.teacher)}</select>
      <select id="sRo" style="width:auto"><option value="">كل الفترات</option>${roomOpts(st.room)}</select>
      <select id="sNa" style="width:auto"><option value="">كل الجنسيات</option>${uniq('nationality').map(g => opt(g, g, g === st.nat)).join('')}</select>
    </div></div>
    <div class="card" style="--a:var(--gold);margin-bottom:10px" id="sKpi"><div class="loading">جارٍ الحساب…</div></div>
    <div class="card c-gold" id="sCard"><div class="head"><h3>صف لكل طالب</h3><span class="hint">اضغط على الطالب لفتح ملفه · الفلاتر داخل الجدول للبرنامج والمعلم والفترة</span></div><div id="sTbl"></div></div>
    <details class="card" style="margin-top:10px"><summary><b>كيف تُحسب الأرقام؟</b></summary><div class="small" style="line-height:1.9;margin-top:8px">
      • <b>الحفظ والربط والمراجعة</b>: عدد الأحاديث في المهام التي علّم الطالب على إنجازها من واجبه. المهمة التي لا تحددها الخطة في أيامها (كالمراجعة التي يختارها المعلم)، أو خطة بلا تنفيذ عند الطالب، تُؤخذ من رصد المعلم.<br>
      • <b>التكرار</b>: مجموع مرات التكرار المطلوبة في الأيام التي علّم فيها الطالب على التكرار.<br>
      • <b>التسميع</b>: عدد الأحاديث التي سمّعها للمعلم (حفظ وربط ومراجعة)، و<b>المحفوظ المسمَّع</b> بلا تكرار للأحاديث المعادة.<br>
      • <b>الالتزام</b>: من المهام التي عليها درجة في الخطة: نصيب الطالب إذا علّم عليها، ونصيب المعلم إذا رصد فيها قيمة، حسب «القواعد ← الالتزام». الأيام التي ليس فيها مهام عليها درجة لا تُحسب.<br>
      • <b>الضبط</b>: متوسط درجة التسميع ÷ الدرجة الكاملة، من المهام المعلّمة «تقييم الضبط».<br>
    </div></details>`;
  $$('[data-sp]', el).forEach(b => b.onclick = () => { st.preset = b.dataset.sp; route(); });
  $('#sF').onchange = e => { st.preset = 'custom'; st.from = e.target.value; route(); };
  $('#sT').onchange = e => { st.preset = 'custom'; st.to = e.target.value; route(); };
  [['#sPl', 'plan'], ['#sTe', 'teacher'], ['#sRo', 'room'], ['#sNa', 'nat']].forEach(([id, k]) => $(id).onchange = e => { st[k] = e.target.value; route(); });
  cardFull($('#sCard'));

  const planIds = [...new Set(studs.map(s => s.assign.plan_id))];
  const progs = {}; for (const id of planIds) progs[id] = await planProgress(id);
  if (!el.isConnected) return;
  const { data: lv } = await db.from('leave_requests').select('student_id, date_from, date_to').eq('status', 'approved').lte('date_from', to).gte('date_to', from);
  const leaveOn = (sid, d) => (lv || []).some(l => l.student_id === sid && l.date_from <= d && l.date_to >= d) || !!A.holdOn(D.studentById[sid]?.assign, d);
  const allDates = datesBetween(from, to);

  const rows = studs.map(s => {
    const P = PL[s.assign.plan_id], nDays = Object.keys(P.days).length, prog = progs[P.id][s.id] || {};
    const hasExec = P.student_execution !== 'none' && P.cols.some(c => c.executor === 'student' || c.executor === 'both');
    const hasRec = P.recitation_mode !== 'none';
    const tasksE = A.groupTasks(P.cols, c => c.executor === 'student' || c.executor === 'both').filter(t => !A.isViewOnly(t));
    const eTasksS = A.execTasks(P);
    const tasksT = A.groupTasks(P.cols, c => c.executor === 'teacher' || c.executor === 'both');
    // المهمة تُعدّ من واجب الطالب إذا حدّدتها الخطة في أيامها، وإلا (مثل مراجعة يحددها المعلم) من رصد المعلم
    const fromExec = new Set(hasExec ? tasksE.filter(t => Object.values(P.days).some(d => A.fmtTaskVal(t, d.vals) != null)).map(t => t.task) : []);
    const o = { s, name: s.name, email: s.email || '', program: P.name, teacher: s.teacher, room: s.room, gender: s.gender || '', nat: s.nationality || '', memo: 0, link: 0, review: 0, repeat: 0 };
    const add = (t, vals) => { if (!['memo', 'link', 'review', 'repeat'].includes(t.task)) return; o[t.task] += t.single ? (t.task === 'repeat' ? (+vals[t.single.id] || 0) : (vals[t.single.id] ? 1 : 0)) : rangeLen(vals[t.from.id], vals[t.to.id]); };
    const start = [s.assign.start_date, s.join_date, from].filter(Boolean).sort().pop();
    // تنفيذ الطالب
    let need = 0, ok = 0, execDays = 0, excE = new Set();
    if (hasExec) allDates.filter(d => d >= start && d < TODAY && isWork(P, d)).forEach(d => {
      if (leaveOn(s.id, d)) { excE.add(d); return; }
      const dn = A.planDayFor(s.assign, P, nDays, d), dv = P.days[dn]?.vals || {}, done = prog[dn] || new Set();
      let any = false;
      tasksE.forEach(t => { if (A.fmtTaskVal(t, dv) == null || A.isViewOnly(t)) return; if (t.cols.some(c => done.has(c.id))) { any = true; add(t, dv); } });
      const wx = A.dayExec(eTasksS, dv, done); if (wx) { need++; ok += wx.ratio; }
      if (any) execDays++;
    });
    // رصد المعلم
    const rs = (D.recsByStudent[s.id] || []).filter(r => r.plan_id === P.id && r.rec_date >= from && r.rec_date <= to);
    const got = rs.filter(r => ACH.includes(r.status));
    let recited = 0;
    got.forEach(r => tasksT.forEach(t => { if (t.single || !['memo', 'link', 'review'].includes(t.task)) return; let n = rangeLen(r.vals?.[t.from.id], r.vals?.[t.to.id]); if (!n && t.task === 'memo') n = rangeLen(r.memo_from, r.memo_to); recited += n; if (!fromExec.has(t.task)) o[t.task] += n; }));
    o.recited = recited;
    o.memorized = A.unionCount(got.filter(r => r.status !== 'review_only').map(r => [r.memo_from == null ? null : +r.memo_from, r.memo_to == null ? null : +r.memo_to]));
    const ss = statsOf(s, from, to);

    o.excused = new Set([...rs.filter(r => r.status === 'excused').map(r => r.rec_date), ...excE]).size;
    o.execDays = hasExec ? execDays : null;
    o.avg = ss.avg;
    const recPct = hasRec ? ss.pct : null, exPct = hasExec && need ? Math.round(ok / need * 100) : null;
    o.recPct = recPct; o.exPct = exPct;
    if (hasRec && P.student_execution === 'counts') { const rw = P.recitation_weight ?? 50, ew = P.execution_weight ?? 50; o.commit = recPct != null && exPct != null ? Math.round((recPct * rw + exPct * ew) / (rw + ew)) : (recPct ?? exPct); o.basis = 'تسميع + تنفيذ'; }
    else if (hasRec) { o.commit = recPct; o.basis = 'تسميع'; }
    else { o.commit = exPct; o.basis = 'تنفيذ'; }

  const pcs = {}; for (const id of planIds) { const { data } = await db.rpc('plan_commitment', { p_plan: id, p_from: from, p_to: to, p_student: null }); (data || []).forEach(r => pcs[r.student_id] = r); }

  rows.forEach(o => { const m = exA.filter(a => a.student_id === o.s.id && (a.submitted_at || '').slice(0, 10) >= from && (a.submitted_at || '').slice(0, 10) <= to); o.exams = m.length; o.examsPassed = m.filter(a => a.passed).length; });
  const sum = k => rows.reduce((a, r) => a + (r[k] || 0), 0);
  const avgOf = k => { const v = rows.map(r => r[k]).filter(x => x != null); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };
  $('#sKpi').innerHTML = `<div class="minis">${mini('الطلاب', fmtNum(rows.length), 'slate')}${mini('أحاديث الحفظ', fmtNum(sum('memo')), 'green')}${mini('الربط', fmtNum(sum('link')), 'teal')}${mini('المراجعة', fmtNum(sum('review')), 'blue')}${mini('مرات التكرار', fmtNum(sum('repeat')), 'violet')}${mini('أحاديث مسمَّعة', fmtNum(sum('recited')), 'amber')}
    ${mini('متوسط الالتزام', avgOf('commit') == null ? '—' : avgOf('commit') + '٪', 'teal')}${mini('متوسط الضبط', avgOf('dabt') == null ? '—' : avgOf('dabt') + '٪', 'violet')}${mini('الاختبارات', fmtNum(sum('exams')), 'amber', sum('exams') ? 'نسبة الاجتياز ' + Math.round(sum('examsPassed') / sum('exams') * 100) + '٪' : '')}</div>`;
  const pctColor = v => v >= 90 ? 'var(--green)' : v >= 70 ? 'var(--teal)' : v >= 50 ? '#9A6A08' : 'var(--red)';
  const pctHtml = v => v == null ? '—' : `<b style="color:${pctColor(v)}">${v}٪</b>`;

    // جدول يومي: صف لكل معلم وعمود لكل يوم فيه جلسات
    const dates = [...new Set(recs.map(r => r.rec_date))].sort().slice(-62);
    const cnt = {}; recs.forEach(r => { const k = r.teacher_id + '|' + r.rec_date; cnt[k] = (cnt[k] || 0) + 1; });
    const mx = Math.max(1, ...Object.values(cnt));

    $('#tsMat').innerHTML = dates.length ? `<div class="tbl-wrap" style="max-height:520px"><table class="heat"><thead><tr><th style="position:sticky;right:0;background:var(--card)">المعلم</th>${dates.map(d => `<th class="num" title="${A.dayName(d)} ${A.greg(d)}">${A.dayName(d).replace('ال', '').slice(0, 3)}<br>${d.slice(5).replace('-', '/')}</th>`).join('')}<th class="num">المجموع</th></tr></thead><tbody>
      ${mrows.map(r => `<tr><td style="position:sticky;right:0;background:var(--card);white-space:nowrap">${esc(r.name)}</td>${dates.map(d => { const n = cnt[r.t.id + '|' + d] || 0; return `<td class="num" style="${n ? `background:rgba(20,110,110,${(0.12 + n / mx * 0.7).toFixed(2)});color:${n / mx > 0.55 ? '#fff' : 'inherit'}` : 'color:var(--muted)'}">${n || '·'}</td>`; }).join('')}<td class="num"><b>${r.sessions}</b></td></tr>`).join('')}
      <tr><td style="position:sticky;right:0;background:var(--card)"><b>المجموع</b></td>${dates.map(d => `<td class="num"><b>${recs.filter(r => r.rec_date === d).length}</b></td>`).join('')}<td class="num"><b>${recs.length}</b></td></tr></tbody></table></div>` : '<div class="empty">لا توجد جلسات في هذه الفترة</div>';
    $('#tsExpM').onclick = () => A.exportXlsx(`الجلسات اليومية للمعلمين - ${from} إلى ${to}`, 'الجلسات اليومية',
      [['المعلم', r => r.name], ...dates.map(d => [d, r => cnt[r.t.id + '|' + d] || 0]), ['المجموع', r => r.sessions]], mrows);
  }
};
function teacherSessions(r, from, to) {
  const list = r.rs.slice().sort((a, b) => (b.rec_date + (b.created_at || '')).localeCompare(a.rec_date + (a.created_at || '')));

      { key: 'date', label: 'التاريخ', html: o => A.greg(o.date) }, { key: 'time', label: 'الوقت' }, { key: 'name', label: 'الطالب' }, { key: 'room', label: 'الفترة', filter: true },

  });
}

// ============ تقويم الإنجاز: صف لكل طالب وعمود لكل يوم (التسميع والتنفيذ) ============
const REC_K = { done: ['تم التسميع', 'ت', '#1E8E5A', '#fff'], makeup: ['عوّض', 'ع', '#C9A227', '#2a2200'], review: ['ربط ومراجعة', 'ر', '#2F6FB0', '#fff'], excused: ['مستأذن', 'س', '#7A5BB5', '#fff'], behind: ['متخلّف', '×', '#C8423B', '#fff'], open: ['اليوم، لم يُرصد بعد', '…', '#E9EEF0', '#555'], off: ['لا تسميع', '', 'transparent', ''], future: ['قادم', '', 'transparent', ''] };
const EXE_K = { full: ['أنجز الواجب', '✓', '#1E8E5A', '#fff'], part: ['أنجز جزءًا', '◐', '#E0A526', '#2a2200'], none: ['لم ينفّذ', '✗', '#C8423B', '#fff'], excused: ['مستأذن', 'س', '#7A5BB5', '#fff'], open: ['اليوم', '…', '#E9EEF0', '#555'], off: ['لا واجب', '', 'transparent', ''], future: ['قادم', '', 'transparent', ''] };
// حالة طالب في يوم: للتسميع وللتنفيذ
function dayState(s, P, d, ctx) {
  const out = {};
  const rs = (D.recsByStudent[s.id] || []).filter(r => r.plan_id === P.id);
  const start = [s.assign.start_date, s.join_date].filter(Boolean).sort().pop();
  const before = d < start, fut = d > TODAY;
  if (P.recitation_mode !== 'none') {
    const on = rs.filter(r => r.rec_date === d), mk = rs.find(r => r.status === 'makeup' && r.makes_up_date === d);
    const has = st => on.some(r => r.status === st);
    out.rec = has('present') ? 'done' : mk ? 'makeup' : has('makeup') && !on.some(r => r.makes_up_date) ? 'makeup' : has('review_only') ? 'review' : has('excused') || ctx.leaveOn(s.id, d) ? 'excused'
      : before || !A.isRecitationDay(P, d) ? 'off' : fut ? 'future' : d === TODAY ? 'open' : 'behind';
    out.recs = on.concat(mk ? [mk] : []);
  }
  if (ctx.hasExec) {
    if (before || !isWork(P, d)) out.exe = 'off';
    else if (fut) out.exe = 'future';
    else if (ctx.leaveOn(s.id, d)) out.exe = 'excused';
    else {
      const dn = A.planDayFor(s.assign, P, ctx.nDays, d), dv = P.days[dn]?.vals || {}, done = ctx.prog[s.id]?.[dn] || new Set();
      let n = 0, k = 0; const items = [];
      ctx.tasksE.forEach(t => { const v = A.fmtTaskVal(t, dv); if (v == null) return; n++; const ok = t.cols.some(c => done.has(c.id)); if (ok) k++; items.push([t.name, v, ok]); });
      out.exe = !n ? 'off' : k === n ? 'full' : k ? 'part' : d === TODAY ? 'open' : 'none';
      out.items = items; out.pday = dn;
    }
  }
  return out;
}
// عرض «تقويم» داخل المتابعة اليومية: صف لكل طالب وعمود لكل يوم من الشهر
async function renderCal(el, P, view, studs, title) {
  // نطاق التقويم (حتى 92 يومًا)
  const first = FOL.cFrom, last = [FOL.cTo, A.addDays(FOL.cFrom, 91)].sort()[0];
  const tasksE = A.groupTasks(P.cols, c => c.executor === 'student' || c.executor === 'both').filter(t => !A.isViewOnly(t));
  const hasExec = view === 'exe';
  const K = view === 'rec' ? REC_K : EXE_K, key = view === 'rec' ? 'rec' : 'exe';
  $('#fTitle').textContent = `${A.greg(first)} – ${A.greg(last)}`;
  $('#fHint').textContent = 'اضغط على أي خانة لتفاصيل اليوم، وعلى اسم الطالب لملفه وتقويمه الشهري (التسميع والتنفيذ معًا)';
  const { data: lv } = await db.from('leave_requests').select('student_id, date_from, date_to').eq('status', 'approved').lte('date_from', last).gte('date_to', first);
  const ctx = { leaveOn: (sid, d) => (lv || []).some(l => l.student_id === sid && l.date_from <= d && l.date_to >= d) || !!A.holdOn(D.studentById[sid]?.assign, d), hasExec, tasksE, nDays: Object.keys(P.days).length, prog: hasExec ? await planProgress(P.id) : {} };
  if (!el.isConnected) return;
  const dates = datesBetween(first, last);
  const grid = studs.slice().sort((a, b) => a.name.localeCompare(b.name, 'ar')).map(s => ({ s, days: dates.map(d => dayState(s, P, d, ctx)) }));
  const keys = view === 'rec' ? ['done', 'makeup', 'review', 'excused', 'behind'] : ['full', 'part', 'none', 'excused'];
  const tot = {}; grid.forEach(g => g.days.forEach(x => { if (x[key]) tot[x[key]] = (tot[x[key]] || 0) + 1; }));
  $('#fKpi').innerHTML = `<div class="cal-legend">${keys.map(k => `<span class="cal-lg"><i style="background:${K[k][2]};color:${K[k][3]}">${K[k][1]}</i>${K[k][0]} <b>${fmtNum(tot[k] || 0)}</b></span>`).join('')}</div>`;
  const okKeys = view === 'rec' ? ['done', 'makeup', 'review'] : ['full'], badKey = view === 'rec' ? 'behind' : 'none';
  const draw = () => {
    const t = norm($('#fQ')?.value || '');
    const rows = grid.map((g, i) => [g, i]).filter(([g]) => !t || norm(g.s.name).includes(t));
    $('#fTbl').innerHTML = rows.length ? `<div class="tbl-wrap" style="max-height:70vh"><table class="cal-t"><thead><tr><th class="cal-n">الطالب</th>${dates.map(d => `<th class="${d === TODAY ? 'today' : ''}${isWork(P, d) ? '' : ' wk'}" title="${A.dayName(d)} ${A.greg(d)} · ${A.hijri(d)}">${A.dayName(d).replace('ال', '').slice(0, 2)}<br>${+d.slice(8)}</th>`).join('')}
      <th class="num" title="${view === 'rec' ? 'أيام التسميع المنجزة: تم + عوّض + ربط ومراجعة' : 'أيام الواجب المكتملة'}">${view === 'rec' ? 'منجز' : 'مكتمل'}</th><th class="num" title="${K[badKey][0]}">${K[badKey][1]}</th></tr></thead><tbody>
      ${rows.map(([g, i]) => `<tr><td class="cal-n"><a href="#" data-sc="${i}">${esc(g.s.name)}</a><div class="hint">${esc(g.s.teacher)} · ${esc(g.s.room)}</div></td>${g.days.map((x, di) => { const k = x[key] ? K[x[key]] : null; return `<td class="cal-c" data-c="${i}|${di}" title="${k ? esc(k[0]) : ''}"><span style="${k && k[1] ? `background:${k[2]};color:${k[3]}` : ''}">${k ? k[1] : ''}</span></td>`; }).join('')}
        <td class="num"><b style="color:var(--green)">${g.days.filter(x => okKeys.includes(x[key])).length}</b></td><td class="num">${(n => n ? `<b style="color:var(--red)">${n}</b>` : '0')(g.days.filter(x => x[key] === badKey).length)}</td><td><button class="btn sm ghost" type="button" data-act="${g.s.id}">رصد إجراء</button></td></tr>`).join('')}
      </tbody></table></div><div class="tbl-foot">${rows.length} طالبًا</div>` : '<div class="empty">لا يوجد طلاب</div>';
    $$('[data-c]', $('#fTbl')).forEach(td => td.onclick = () => { const [si, di] = td.dataset.c.split('|').map(Number); calDay(grid[si].s, P, dates[di], grid[si].days[di]); });
    $$('[data-sc]', $('#fTbl')).forEach(a => a.onclick = e => { e.preventDefault(); studentFile(grid[+a.dataset.sc].s.id); });
    $$('[data-act]', $('#fTbl')).forEach(b => b.onclick = e => { e.stopPropagation(); actionPopup(D.studentById[b.dataset.act], view === 'rec' ? 'rec' : 'exec', P); });
  };
  $('#fQ') && $('#fQ').addEventListener('input', draw); draw();
  $('#fExport').onclick = () => A.exportXlsx(`${title} - تقويم - ${P.name} - ${first} إلى ${last}`, 'التقويم', [['الطالب', g => g.s.name], ['المعلم', g => g.s.teacher], ['الفترة', g => g.s.room],
    ...dates.map((d, di) => [d, g => { const x = g.days[di][key]; return x && K[x][1] ? K[x][0] : ''; }]), [view === 'rec' ? 'أيام منجزة' : 'أيام مكتملة', g => g.days.filter(x => okKeys.includes(x[key])).length], [K[badKey][0], g => g.days.filter(x => x[key] === badKey).length]], grid);
}
function calDay(s, P, d, x) {
  const recLine = r => `<div class="hist"><div class="row"><b>${STATUS[r.status]?.label || r.status}</b>${r.makes_up_date ? `<span class="hint">تعويض عن ${A.greg(r.makes_up_date)} · رُصد ${A.greg(r.rec_date)}</span>` : ''}</div><div class="small muted">${r.memo_from ? 'الحفظ: ' + +r.memo_from + '–' + +r.memo_to + ' · ' : ''}${r.score != null ? 'الدرجة: ' + fmtNum(r.score, 2) + ' · ' : ''}${esc(D.teacherById[r.teacher_id]?.name || '')}${r.notes ? ' · ' + esc(r.notes) : ''}</div></div>`;
  drawer(`${s.name} · ${A.dayName(d)} ${A.greg(d)}`, `<div class="stack">
    ${x.rec ? `<div class="card c-teal"><div class="head"><h3>التسميع</h3><span class="pill" style="background:${REC_K[x.rec][2]};color:${REC_K[x.rec][3]}">${REC_K[x.rec][0]}</span></div>${(x.recs || []).map(recLine).join('') || '<div class="hint">لا يوجد رصد لهذا اليوم.</div>'}</div>` : ''}
    ${x.exe ? `<div class="card c-violet"><div class="head"><h3>التنفيذ${x.pday ? ' · يوم الخطة ' + x.pday : ''}</h3><span class="pill" style="background:${EXE_K[x.exe][2]};color:${EXE_K[x.exe][3]}">${EXE_K[x.exe][0]}</span></div>${(x.items || []).map(([n, v, ok]) => `<div class="row" style="padding:4px 0;border-bottom:1px solid var(--line)"><span>${ok ? '<b style="color:var(--green)">✓</b>' : '<b style="color:var(--red)">✗</b>'} ${esc(n)}</span><span class="hint">${esc(v)}</span></div>`).join('') || '<div class="hint">لا واجب في هذا اليوم.</div>'}</div>` : ''}
    <div class="row" style="gap:6px;justify-content:flex-start"><button class="btn sm" id="cdRec">رصد / عرض التسميع</button><button class="btn ghost sm" id="cdFile">ملف الطالب</button></div></div>`, root => {
    $('#cdRec', root).onclick = () => adminRecord(s.id);
    $('#cdFile', root).onclick = () => studentFile(s.id);
  });
}
// تقويم شهري لطالب واحد بشكل أسابيع (التسميع والتنفيذ معًا) — يظهر في ملف الطالب
async function studentMonth(s, P, month) {
  const [y, m] = month.split('-').map(Number);
  const first = `${month}-01`, last = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
  const tasksE = A.groupTasks(P.cols, c => c.executor === 'student' || c.executor === 'both').filter(t => !A.isViewOnly(t));
  const hasExec = P.student_execution !== 'none' && tasksE.length > 0;
  const [{ data: lv }, prog] = await Promise.all([
    db.from('leave_requests').select('student_id, date_from, date_to').eq('student_id', s.id).eq('status', 'approved').lte('date_from', last).gte('date_to', first),
    hasExec ? db.from('plan_progress').select('plan_day_id, column_id').eq('student_id', s.id).then(r => r.data || []) : []]);
  const dayOf = {}; Object.values(P.days).forEach(d => dayOf[d.id] = d.day_number);
  const mine = {}; prog.forEach(x => { const dn = dayOf[x.plan_day_id]; if (dn != null) (mine[dn] ||= new Set()).add(x.column_id); });
  const ctx = { leaveOn: (sid, d) => (lv || []).some(l => l.date_from <= d && l.date_to >= d) || !!A.holdOn(s.assign, d), hasExec, tasksE, nDays: Object.keys(P.days).length, prog: { [s.id]: mine } };
  const dates = datesBetween(first, last);
  return { dates, days: dates.map(d => dayState(s, P, d, ctx)) };
}
function monthGridHtml(dates, days) {
  const pad = new Date(dates[0] + 'T12:00:00Z').getUTCDay();
  const cells = [...Array(pad).fill(null), ...dates.map((d, i) => [d, days[i]])];
  while (cells.length % 7) cells.push(null);
  return `<div class="cal-month">${['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'].map(n => `<div class="cm-h">${n}</div>`).join('')}${cells.map(c => { if (!c) return '<div class="cm-d empty"></div>'; const [d, x] = c; const r = x.rec ? REC_K[x.rec] : null, e = x.exe ? EXE_K[x.exe] : null;
    return `<div class="cm-d${d === TODAY ? ' today' : ''}" data-d="${d}"><span class="cm-n">${+d.slice(8)}</span>${r && r[1] ? `<span class="cm-b" style="background:${r[2]};color:${r[3]}">${r[0]}</span>` : ''}${e && e[1] ? `<span class="cm-b" style="background:${e[2]};color:${e[3]}">${e[0]}</span>` : ''}</div>`; }).join('')}</div>`;
}
async function drawStudentCal(box, s, P, month) {
  box.innerHTML = '<div class="loading">جارٍ التحميل…</div>';
  const { dates, days } = await studentMonth(s, P, month);
  box.innerHTML = monthGridHtml(dates, days);
  $$('[data-d]', box).forEach(c => c.onclick = () => { const i = dates.indexOf(c.dataset.d); calDay(s, P, dates[i], days[i]); });
}
