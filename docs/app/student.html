<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>لوحة الطالب — منصة سنن</title>
<meta name="theme-color" content="#0F2F33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سنن">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=20261127f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js?v=20261127f"></script>
<style>
/* تصميم الجوال أولًا: بطاقات مضغوطة، مهام اليوم في الأعلى، والتنقل أسفل الشاشة */
body{font-size:14px;-webkit-tap-highlight-color:transparent}
.topbar{padding-top:max(7px,env(safe-area-inset-top,0px))}
.wrap{max-width:640px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-left,0px)) calc(86px + env(safe-area-inset-bottom,0px))}
.hello{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:18px;padding:14px 14px 12px;border-bottom:3px solid var(--gold);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.hello .date{font-size:11.5px;color:var(--gold);font-weight:700}
.hello h2{font-size:18px;margin:4px 0 8px;line-height:1.35}
.chipsm{display:flex;flex-wrap:wrap;gap:5px}
.chipsm span{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:2px 9px;font-size:11.5px;color:#E3ECEC;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipsm svg{width:13px;height:13px;flex:none;color:var(--gold)}
.ring{--p:0;width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.14) 0);display:grid;place-items:center;flex:none}
.ring div{width:62px;height:62px;border-radius:50%;background:var(--secondary);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:17px;color:#fff;font-variant-numeric:tabular-nums}.ring small{font-size:9.5px;color:#C9DADA}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.st{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.st b{display:block;font-size:19px;color:var(--c,var(--teal));font-variant-numeric:tabular-nums;line-height:1.3}
.st span{font-size:11px;color:var(--muted);font-weight:700}
.h3row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:16px 2px 8px}
.h3row h3{font-size:15.5px;color:var(--primary)}.h3row span{font-size:12px;color:var(--muted);font-weight:700}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.task.done{background:color-mix(in srgb,var(--green) 7%,#fff);border-color:color-mix(in srgb,var(--green) 30%,#fff)}
.tick{width:40px;height:40px;border-radius:50%;border:2px solid color-mix(in srgb,var(--teal) 45%,#fff);background:#fff;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.tick.on{background:var(--green);border-color:var(--green)}
.tick.none{border-style:dashed;cursor:default;width:34px;height:34px}
.task b{display:block;color:var(--primary);font-size:14.5px}.task .v{font-size:13px;color:var(--muted)}
.notice{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;margin-top:6px}
.notice.gold{background:color-mix(in srgb,var(--gold) 14%,#fff);border:1px solid color-mix(in srgb,var(--gold) 45%,#fff);color:#5E4D27}
.notice.blue{background:color-mix(in srgb,var(--blue) 9%,#fff);border:1px solid color-mix(in srgb,var(--blue) 25%,#fff);color:#24496B;display:flex;justify-content:space-between;align-items:center;gap:10px}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.links a{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:var(--primary);font-weight:700;font-size:13.5px;min-height:50px}
.links a .ic{color:var(--gold)}
.links a[aria-disabled="true"]{opacity:.55;pointer-events:none}
.seg{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
.seg button{white-space:nowrap;padding:6px 13px}
.rec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;display:grid;gap:3px}
.rec .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec .top b{font-size:13.5px}
.rec .sub{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.rec .sub b{color:var(--primary)}
.rec .note{margin:0;font-size:12px;color:var(--muted);background:var(--track);border-radius:8px;padding:5px 8px}
.rank{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-bottom:1px dashed var(--soft-line)}
.rank .r{font-weight:800;color:#7A6534;text-align:center}
.rank:nth-child(-n+3) .r{color:#fff;background:var(--gold);border-radius:8px;padding:2px 0}
.rank .nm{font-weight:700;font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.rank .val{text-align:left;font-size:12px;color:var(--muted)}.rank .val b{display:block;color:var(--teal);font-size:15px}
.rank.me{background:color-mix(in srgb,var(--gold) 16%,#fff);border-radius:10px}
.myrank{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.myrank b{font-size:22px;color:#7A6534}
.card{border-radius:14px}
input,select,textarea{font-size:16px!important}
.tabbar a{font-size:11px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">سنن</span><h1>لوحة الطالب</h1></div>
  <div class="icons" id="icons"></div>
</header>
<div class="wrap" id="main"><div class="loading">جارٍ التحميل…</div></div>
<nav class="tabbar" id="tabbar" aria-label="الأقسام"></nav>
<script>
(async () => {
'use strict';
const A = App, { db, $, $$, esc, fmtNum, toast, statusPill, STATUS, svg } = A;
const me = await A.requireRole(['student']);
if (!me) return;
const TODAY = A.todayMakkah();
A.topIcons($('#icons'));

const { data: stu } = await db.from('students').select('*').eq('user_id', me.id).maybeSingle();
if (!stu) { $('#main').innerHTML = '<div class="error">حسابك غير مرتبط بملف طالب. تواصل مع إدارة البرنامج.</div>'; return; }
if (stu.is_archived) { $('#main').innerHTML = '<div class="error">حسابك مؤرشف ولا يمكن استخدام المنصة حاليًا. تواصل مع إدارة البرنامج.</div>'; $('#tabbar').hidden = true; return; }
const [asg, ra, recsR, teacherR, memR, unread] = await Promise.all([
  db.from('plan_assignments').select('*').eq('student_id', stu.id).is('ended_at', null).maybeSingle().then(r => r.data),
  db.from('room_assignments').select('room_id').eq('assignee_type', 'student').eq('assignee_id', stu.id).then(r => r.data || []),
  db.from('plan_recitations').select('*').eq('student_id', stu.id).is('superseded_by', null).order('rec_date', { ascending: false }).limit(1000),
  stu.teacher_id ? db.from('teachers').select('user_id').eq('id', stu.teacher_id).maybeSingle() : Promise.resolve({ data: null }),
  db.rpc('memorized_of', { p_student: stu.id }),
  db.from('notifications').select('id', { count: 'exact', head: true }).eq('channel', 'inbox').is('read_at', null)
]);
const recs = recsR.data || [];
let teacherName = '—';
if (teacherR.data) { const { data: tu } = await db.from('users').select('name').eq('id', teacherR.data.user_id).maybeSingle(); teacherName = tu?.name || '—'; }
const room = ra[0] ? (await db.from('audio_rooms').select('*').eq('id', ra[0].room_id).maybeSingle()).data : null;
let P = null, cols = [], days = {};
if (asg) {
  const [p, c, d] = await Promise.all([db.from('program_plans').select('*').eq('id', asg.plan_id).maybeSingle(), db.from('plan_columns').select('*').eq('plan_id', asg.plan_id).order('seq'), A.fetchAll(() => db.from('plan_days').select('id, day_number, vals').eq('plan_id', asg.plan_id))]);
  P = p.data; cols = c.data || []; d.forEach(x => days[x.day_number] = x);
}
const planLive = P && P.status === 'active';
const nDays = Object.keys(days).length;
const dayN = planLive ? A.planDayFor(asg, P, nDays) : null;
const today = dayN ? days[dayN] : null;
let unreadCount = unread.count || 0;

// الإحصاءات
const wd = P?.workdays || [0, 1, 2, 3, 4];
const startD = asg?.start_date || stu.join_date;
const expected = A.workdaysBetween(startD, A.addDays(TODAY, -1), wd);
const achDays = new Set(recs.filter(r => ['present', 'makeup', 'review_only'].includes(r.status) && r.rec_date < TODAY).map(r => r.rec_date)).size;
const excDays = new Set(recs.filter(r => r.status === 'excused').map(r => r.rec_date)).size;
const base = Math.max(0, expected - excDays);
const pct = base ? Math.min(100, Math.round(achDays / base * 100)) : null;
const scores = recs.filter(r => r.score != null).map(r => +r.score);
const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
const memorized = +memR.data || 0;

// الضبط والالتزام والتقييم (تُحسب من إعدادات الخطة وأوزان أعمدتها)
const M = { dabt: null, iltizam: null, total: null, iltizamBasis: '' };
if (P) {
  const max = +(P.score_rules?.max || 10);
  if (P.recitation_mode !== 'none' && avg != null) M.dabt = Math.round(avg / max * 100);
  const PP = { ...P, cols };
  const eTasks = A.execTasks(PP);
  if (P.student_execution !== 'none' && eTasks.length && nDays) {
    const [{ data: prog }, { data: lv }] = await Promise.all([
      db.from('plan_progress').select('plan_day_id, column_id').eq('student_id', stu.id),
      db.from('leave_requests').select('date_from, date_to').eq('student_id', stu.id).eq('status', 'approved')]);
    const byDay = {}; (prog || []).forEach(x => (byDay[x.plan_day_id] ||= new Set()).add(x.column_id));
    const onLeave = d => (lv || []).some(l => l.date_from <= d && l.date_to >= d);
    let sum = 0, n = 0;
    for (let d = startD; d && d < TODAY; d = A.addDays(d, 1)) {
      if (!wd.includes(new Date(d + 'T12:00:00Z').getUTCDay()) || onLeave(d)) continue;
      const day = days[A.planDayFor(asg, P, nDays, d)]; if (!day) continue;
      const r = A.dayExec(eTasks, day.vals, byDay[day.id] || new Set()); if (!r) continue;
      sum += r.ratio; n++;
    }
    if (n) { M.iltizam = Math.round(sum / n * 100); M.iltizamBasis = 'تنفيذ الواجب'; }
  } else if (pct != null) { M.iltizam = pct; M.iltizamBasis = 'حضور التسميع'; }
  if (P.student_execution === 'counts' && P.recitation_mode !== 'none' && M.dabt != null && M.iltizam != null) {
    const rw = P.recitation_weight ?? 50, ew = P.execution_weight ?? 50; M.total = Math.round((M.dabt * rw + M.iltizam * ew) / ((rw + ew) || 1));
  } else M.total = P.student_execution === 'counts' && P.recitation_mode === 'none' ? M.iltizam : (M.dabt ?? M.iltizam);
}

const TABS = [["home", "الرئيسية", "home"], ["log", "سجلّي", "book"], ["honor", "لوحة الشرف", "star"], ["leave", "الاستئذان", "leave"]];
const SECTIONS = {};
const ico = (n) => svg(n);

SECTIONS.home = async el => {
  let progress = new Set();
  if (planLive && today) { const { data } = await db.from('plan_progress').select('column_id').eq('student_id', stu.id).eq('plan_day_id', today.id); progress = new Set((data || []).map(x => x.column_id)); }
  const canExec = planLive && P.student_execution !== 'none';
  const tasks = planLive ? A.groupTasks(cols, c => ['student', 'both', 'info'].includes(c.executor)) : [];
  const now = A.nowMakkahHM(), dn = A.DAYS[A.dowMakkah()];
  const live = room && room.active && (room.days || []).includes(dn) && room.start_time && now >= room.start_time.slice(0, 5) && now <= (room.end_time || '23:59').slice(0, 5);
  const workToday = planLive && A.workdaysBetween(TODAY, TODAY, wd);
  const visTasks = tasks.filter(t => A.fmtTaskVal(t, today?.vals) != null);
  // الرابط والعمود «للعرض فقط» معلومة بلا علامة إنجاز
  const viewOnly = t => t.executor === 'info' || t.single?.value_type === 'url';
  const doneN = visTasks.filter(t => !viewOnly(t) && t.cols.some(c => progress.has(c.id))).length; // عدد ما علّم عليه اليوم
  const execN = visTasks.filter(t => !viewOnly(t)).length;
  const ps = A.pushState();
  el.innerHTML = `
    <section class="hello"><div style="min-width:0">
        <div class="date">${A.dayName(TODAY)} · ${A.hijri(TODAY)}</div>
        <h2>السلام عليكم، ${esc(me.name.split(' ')[0])}</h2>
        <div class="chipsm"><span title="الخطة">${ico('plan')}${esc(P?.name || 'لم تُسند خطة')}</span><span title="المعلم">${ico('teacher')}${esc(teacherName)}</span>${room ? `<span title="الفترة">${ico('room')}${esc(room.name)} · ${(room.start_time || '').slice(0, 5)}</span>` : ''}</div>
      </div>
      <div class="ring" style="--p:${M.total || 0}" aria-label="التقييم"><div><span><b>${M.total == null ? '—' : M.total + '٪'}</b><br><small>التقييم</small></span></div></div>
    </section>
    <div class="stats3">
      <div class="st" style="--c:var(--green)"><b>${fmtNum(memorized, 1)}</b><span>حديثًا محفوظًا</span></div>
      <div class="st" style="--c:var(--blue)" title="متوسط درجات التسميع${avg == null ? '' : ': ' + fmtNum(avg, 2)}"><b>${M.dabt == null ? '—' : M.dabt + '٪'}</b><span>الضبط</span></div>
      <div class="st" style="--c:var(--violet)" title="${esc(M.iltizamBasis)}"><b>${M.iltizam == null ? '—' : M.iltizam + '٪'}</b><span>الالتزام</span></div>
    </div>
    ${A.isMobile && (ps === 'default' || ps === 'needs-install') ? `<div class="notice blue"><span>${ps === 'needs-install' ? 'ثبّت التطبيق على جوالك لتصلك الإشعارات.' : 'فعّل الإشعارات لتصلك رسائل المعلم والإدارة.'}</span><button class="btn sm" id="enableBtn">${ps === 'needs-install' ? 'تثبيت' : 'تفعيل'}</button></div>` : ''}
    <div class="h3row"><h3>مهام اليوم</h3><span>${!workToday ? '' : `اليوم ${dayN} من ${nDays}${execN && canExec ? ` · أنجزت ${doneN} من ${execN}` : ''}`}</span></div>
    ${!P ? '<div class="empty">لم تُسند لك خطة بعد. تواصل مع إدارة البرنامج.</div>'
      : !planLive ? '<div class="empty">خطتك لم تُفعَّل بعد.</div>'
      : !workToday ? '<div class="empty">اليوم ليس من أيام الخطة. استرح وراجع ما حفظت.</div>'
      : `${visTasks.map(t => { const v = A.fmtTaskVal(t, today?.vals); const info = viewOnly(t); const can = canExec && !info; const on = t.cols.some(c => progress.has(c.id)); const isUrl = t.single?.value_type === 'url';
          return `<div class="task${on ? ' done' : ''}"><button type="button" class="tick ${can ? (on ? 'on' : '') : 'none'}" ${can ? `data-tick="${t.key}" aria-pressed="${on}" aria-label="${on ? 'إلغاء الإنجاز' : 'تم الإنجاز'}: ${esc(t.name)}"` : 'disabled aria-hidden="true"'}>${on ? '✓' : ''}</button>
            <div><b>${esc(t.single?.value_type === 'bool' ? (t.single.header || t.name).trim() : t.name)}</b><span class="v">${isUrl ? `<a href="${esc(today.vals[t.single.id])}" target="_blank" rel="noopener">فتح الرابط</a>` : t.single?.value_type === 'bool' ? esc(A.taskAmount(t, today?.vals, cols) || 'مطلوب اليوم') : t.task === 'repeat' ? esc(v) + ' مرة' : esc(v)}</span>${A.taskDetails(t, today?.vals).map(([n, x]) => `<span class="v" style="display:block;font-size:12px">${esc(n)}: ${esc(x)}</span>`).join('')}</div></div>`; }).join('') || '<div class="empty">لا مهام في هذا اليوم.</div>'}
      ${canExec && execN ? `<p class="hint" style="margin:2px 4px 0">${P.student_execution === 'counts' ? 'علّم على المهمة بعد إنجازها، ويدخل تنفيذك في تقييمك.' : 'علّم على المهمة بعد إنجازها لمتابعة نفسك.'}</p>` : ''}
      ${A.isRecitationDay(P, TODAY) ? `<div class="notice gold">اليوم يوم تسميع${room ? ' في ' + esc(room.name) + ' الساعة ' + (room.start_time || '').slice(0, 5) + ' بتوقيت مكة' : ''}.</div>` : ''}`}
    <div class="h3row"><h3>روابط</h3></div>
    <div class="links">
      ${room?.meet_url && room.outside_behavior !== 'hidden' || live ? `<a href="${esc(room.meet_url || '#')}" target="_blank" rel="noopener" ${live || room.outside_behavior === 'always_visible' ? '' : 'aria-disabled="true"'}>${ico('room')}${live || room.outside_behavior === 'always_visible' ? 'غرفة التسميع' : 'تُفتح ' + (room.start_time || '').slice(0, 5)}</a>` : ''}
      ${P?.audio_url ? `<a href="${esc(P.audio_url)}" target="_blank" rel="noopener">${ico('mic')}السماع</a>` : ''}${P?.book_url ? `<a href="${esc(P.book_url)}" target="_blank" rel="noopener">${ico('book')}الكتاب</a>` : ''}${P?.whatsapp_url ? `<a href="${esc(P.whatsapp_url)}" target="_blank" rel="noopener">${ico('users')}مجموعة البرنامج</a>` : ''}${(P?.extra_links || []).filter(l => /^https?:\/\//i.test(l.url || '')).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${ico('book')}${esc(l.label || 'رابط')}</a>`).join('')}
    </div>`;
  $('#enableBtn', el) && ($('#enableBtn', el).onclick = () => A.pushState() === 'needs-install' ? A.installSheet() : A.pushSheet());
  $$('[data-tick]', el).forEach(b => b.onclick = async () => {
    const t = tasks.find(x => x.key === b.dataset.tick); const on = b.getAttribute('aria-pressed') === 'true';
    b.disabled = true;
    const res = on ? await db.from('plan_progress').delete().eq('student_id', stu.id).eq('plan_day_id', today.id).in('column_id', t.cols.map(c => c.id))
      : await db.from('plan_progress').insert({ student_id: stu.id, plan_day_id: today.id, column_id: t.key });
    if (res.error) { b.disabled = false; return toast('لم يُحفظ: ' + res.error.message, true); }
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
    toast(on ? 'أُلغي الإنجاز' : 'أحسنت، سُجّل الإنجاز'); route(true);
  });
};

let logFilter = 'all', logShown = 15;
SECTIONS.log = el => {
  const list = recs.filter(r => logFilter === 'all' || r.status === logFilter);
  const cnt = k => recs.filter(r => r.status === k).length;
  el.innerHTML = `<div class="stats3">
      <div class="st" style="--c:var(--green)"><b>${achDays}</b><span>أيام الإنجاز</span></div>
      <div class="st" style="--c:var(--violet)"><b>${excDays}</b><span>أيام الاستئذان</span></div>
      <div class="st" style="--c:var(--red)"><b>${Math.max(0, base - achDays)}</b><span>غياب تقديري</span></div>
    </div>
    <div class="seg" style="margin-bottom:10px">${[['all', 'الكل', recs.length], ['present', 'حاضر', cnt('present')], ['makeup', 'تعويض', cnt('makeup')], ['review_only', 'ربط ومراجعة', cnt('review_only')], ['excused', 'مستأذن', cnt('excused')]].filter(x => x[0] === 'all' || x[2]).map(([k, l, n]) => `<button type="button" data-f="${k}" aria-pressed="${logFilter === k}">${l} (${n})</button>`).join('')}</div>
    ${list.slice(0, logShown).map(r => `<div class="rec"><div class="top"><b>${A.dayName(r.rec_date)} ${A.greg(r.rec_date)}</b>${statusPill(r.status)}</div>
      <div class="sub">${r.memo_from ? `<span>الحفظ <b>${+r.memo_from}–${+r.memo_to}</b></span>` : ''}${r.score != null ? `<span>الدرجة <b>${fmtNum(r.score, 2)}</b></span>` : ''}${r.makes_up_date ? `<span>تعويض عن ${A.greg(r.makes_up_date)}</span>` : ''}</div>
      ${r.notes ? `<p class="note">ملاحظة المعلم: ${esc(r.notes)}</p>` : ''}</div>`).join('') || '<div class="empty">لا توجد سجلات</div>'}
    ${list.length > logShown ? `<button class="btn ghost block" id="more">عرض المزيد (${list.length - logShown})</button>` : ''}`;
  $$('[data-f]', el).forEach(b => b.onclick = () => { logFilter = b.dataset.f; logShown = 15; route(true); });
  $('#more', el) && ($('#more', el).onclick = () => { logShown += 15; route(true); });
};

SECTIONS.honor = async el => {
  const st = SECTIONS.honor.st ||= { period: 'month', more: false };
  const from = st.period === 'month' ? TODAY.slice(0, 8) + '01' : null;
  const { data, error } = await db.rpc('honor_board', { p_plan: asg?.plan_id || null, p_from: from, p_to: null });
  if (error) { el.innerHTML = `<div class="error">${esc(error.message)}</div>`; return; }
  const list = (data || []).filter(x => +x.memorized > 0);
  const myRank = list.findIndex(x => x.student_id === stu.id);
  const shown = st.more ? list : list.slice(0, 10);
  el.innerHTML = `<div class="seg" style="margin-bottom:10px"><button type="button" data-p="month" aria-pressed="${st.period === 'month'}">هذا الشهر</button><button type="button" data-p="all" aria-pressed="${st.period === 'all'}">منذ البداية</button></div>
    ${myRank >= 0 ? `<div class="myrank"><span>ترتيبك في ${esc(P?.name || 'الخطة')}</span><span><b>${myRank + 1}</b> <span class="muted">من ${list.length}</span></span></div>` : ''}
    <div class="card" style="padding:4px 8px">${shown.map((x, i) => `<div class="rank${x.student_id === stu.id ? ' me' : ''}"><span class="r">${i + 1}</span><span class="nm">${esc(x.name)}${x.student_id === stu.id ? ' <span class="pill gold">أنت</span>' : ''}</span><span class="val"><b>${fmtNum(x.memorized, 1)}</b>حديث</span></div>`).join('') || '<div class="empty">لا توجد بيانات بعد</div>'}</div>
    ${list.length > 10 ? `<button class="btn ghost block" id="more" style="margin-top:8px">${st.more ? 'عرض أول 10 فقط' : 'عرض المزيد'}</button>` : ''}`;
  $$('[data-p]', el).forEach(b => b.onclick = () => { st.period = b.dataset.p; st.more = false; route(true); });
  $('#more', el) && ($('#more', el).onclick = () => { st.more = !st.more; route(true); });
};
SECTIONS.leave = async el => {
  const { data } = await db.from('leave_requests').select('*').eq('student_id', stu.id).order('created_at', { ascending: false });
  const lim = P?.discipline_rules?.leave_max_month;
  const month = TODAY.slice(0, 7);
  const used = (data || []).filter(l => l.status === 'approved' && l.date_from.slice(0, 7) === month).reduce((a, l) => a + A.daysBetween(l.date_from, l.date_to) + 1, 0);
  el.innerHTML = `<div class="h3row" style="margin-top:2px"><h3>طلب استئذان</h3>${lim != null ? `<span>استخدمت ${used} من ${lim} أيام هذا الشهر</span>` : ''}</div>
    <form class="card c-violet stack" id="lf">
      <div class="g2"><label class="f" for="lF">من<input id="lF" type="date" value="${TODAY}" min="${TODAY}" required></label><label class="f" for="lT">إلى<input id="lT" type="date" value="${TODAY}" min="${TODAY}" required></label></div>
      <label class="f" for="lR">السبب<select id="lR"><option>سفر</option><option>مرض</option><option>اختبارات دراسية</option><option>ظرف عائلي</option><option>أخرى</option></select></label>
      <label class="f" for="lD">تفاصيل <span class="hint">اختياري</span><textarea id="lD"></textarea></label>
      <p class="hint">يصل طلبك لإدارة البرنامج، ويصلك إشعار بالقرار. الاستئذان المقبول لا يُحسب غيابًا.</p>
      <button class="btn" type="submit">إرسال الطلب</button></form>
    <div class="section"><div class="card"><h3>طلباتي</h3>${(data || []).map(l => `<div class="row" style="border-bottom:1px dashed var(--soft-line);padding:7px 0"><span>${A.greg(l.date_from)}${l.date_to !== l.date_from ? ' – ' + A.greg(l.date_to) : ''} · ${esc(l.reason)}</span><span class="pill ${{ pending: 'warn', approved: 'ok', rejected: 'bad', cancelled: 'plain' }[l.status]}">${{ pending: 'قيد المراجعة', approved: 'مقبول', rejected: 'مرفوض', cancelled: 'ملغى' }[l.status]}</span></div>`).join('') || '<p class="muted small" style="margin-top:6px">لا توجد طلبات</p>'}</div></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const f = $('#lF').value, t = $('#lT').value;
    if (!f || !t || t < f) return toast('تاريخ النهاية يجب ألا يسبق البداية', true);
    const { error } = await db.from('leave_requests').insert({ student_id: stu.id, date_from: f, date_to: t, reason: $('#lR').value, details: $('#lD').value.trim() || null });
    if (error) return toast('لم يُرسل: ' + error.message, true);
    toast('أُرسل الطلب'); route(true);
  };
};

SECTIONS.profile = el => A.profileSection(el, me, { seed: { phone: stu.phone, gender: stu.gender, nationality: stu.nationality, residence: stu.residence, birth_date: stu.birth_date, education: stu.education, quran_memorization: stu.quran_parts != null ? stu.quran_parts + ' جزء' : null } });

function route(keepScroll) {
  const k = (location.hash || '#home').slice(1);
  const key = SECTIONS[k] ? k : 'home';
  $('#tabbar').innerHTML = TABS.map(([h, l, ic]) => `<a href="#${h}" aria-current="${h === key ? 'page' : 'false'}">${svg(ic)}${l}</a>`).join('');
  const y = window.scrollY;
  const host = document.createElement('div');
  host.innerHTML = '<div class="loading">جارٍ التحميل…</div>';
  $('#main').replaceChildren(host);
  Promise.resolve(SECTIONS[key](host)).then(() => { if (keepScroll === true) window.scrollTo(0, y); }).catch(e => { if (host.isConnected) host.innerHTML = `<div class="error">${esc(e.message || e)}</div>`; });
  if (keepScroll !== true) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => route());
document.addEventListener('sonnan-push', () => { if ((location.hash || '#home') === '#home') route(true); });
route();
// أول فتح من الجوال: يطلب التثبيت، وبعد التثبيت يطلب تفعيل الإشعارات
A.setupPWA({ ask: true });
})();
</script>
</body>
