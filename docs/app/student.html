<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>لوحة الطالب — منصة سنن</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<style>
body{font-size:14px}
.wrap{max-width:980px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-left,0px)) 90px}
.hero{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:20px;padding:20px 18px;border-bottom:3px solid var(--gold);margin-bottom:14px}
.hero .eyebrow{font-size:12px;color:var(--gold);font-weight:700}
.hero h2{font-size:24px;margin:6px 0 14px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meta div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 10px;min-width:0}
.meta small{display:block;color:#C9DADA;font-size:11px}.meta b{display:block;margin-top:3px;font-size:13.5px;overflow-wrap:anywhere}
@media (max-width:560px){.meta{grid-template-columns:1fr 1fr}.hero h2{font-size:20px}}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:14px}
@media (max-width:700px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.metric{background:#fff;border:1px solid var(--line);border-top:3px solid var(--c,var(--teal));border-radius:14px;padding:12px;text-align:center}
.metric span{display:block;color:var(--muted);font-size:12px;font-weight:700}.metric b{display:block;font-size:26px;color:var(--c,var(--teal));margin-top:3px;font-variant-numeric:tabular-nums}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid color-mix(in srgb,var(--teal) 40%,#fff);background:#fff;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
.tick.on{background:var(--green);border-color:var(--green)}
.tick.none{border-style:dashed;cursor:default}
.task b{display:block;color:var(--primary)}.task .v{font-size:13px;color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.links a{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:var(--primary);font-weight:700}
.links a:hover{border-color:var(--gold)}
.section{margin-top:18px}
.inbox-item{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--soft-line);cursor:pointer}
.inbox-item .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:7px}
.inbox-item.read .dot{background:transparent}
.rank-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px dashed var(--soft-line)}
.rank-row .r{font-weight:800;color:#7A6534;text-align:center}
.rank-row.me{background:color-mix(in srgb,var(--gold) 16%,#fff);border-radius:10px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:700;padding:8px 2px 9px;position:relative}
.tabbar a[aria-current="page"]{color:var(--primary)}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tabbar .ic{display:block;margin:0 auto 2px;width:21px;height:21px}
.tabbar .badge{position:absolute;top:3px;inset-inline-start:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">سنن</span><h1>لوحة الطالب<span class="sep">|</span><span class="prog">تابع إنجازك ونافس على التميز</span></h1></div>
  <div class="tools"><button class="pillbtn" type="button" id="logout">خروج</button></div>
</header>
<div class="wrap" id="main"><div class="loading">جارٍ التحميل…</div></div>
<nav class="tabbar" id="tabbar"></nav>
<script>
(async () => {
'use strict';
const A = App, { db, $, $$, esc, fmtNum, toast, statusPill, STATUS, svg } = A;
const me = await A.requireRole(['student']);
if (!me) return;
const TODAY = A.todayMakkah();
$('#logout').onclick = A.logout;

const { data: stu } = await db.from('students').select('*').eq('user_id', me.id).maybeSingle();
if (!stu) { $('#main').innerHTML = '<div class="error">حسابك غير مرتبط بملف طالب. تواصل مع إدارة البرنامج.</div>'; return; }
if (stu.is_archived) { $('#main').innerHTML = '<div class="error">حسابك مؤرشف ولا يمكن استخدام المنصة حاليًا. تواصل مع إدارة البرنامج.</div>'; $('#tabbar').hidden = true; return; }
const [asg, ra, recsR, teacherR, memR, unread] = await Promise.all([
  db.from('plan_assignments').select('*').eq('student_id', stu.id).is('ended_at', null).maybeSingle().then(r => r.data),
  db.from('room_assignments').select('room_id').eq('assignee_type', 'student').eq('assignee_id', stu.id).then(r => r.data || []),
  db.from('plan_recitations').select('*').eq('student_id', stu.id).is('superseded_by', null).order('rec_date', { ascending: false }).limit(1000),
  stu.teacher_id ? db.from('teachers').select('user_id').eq('id', stu.teacher_id).maybeSingle() : Promise.resolve({ data: null }),
  db.rpc('memorized_of', { p_student: stu.id }),
  db.from('notifications').select('id', { count: 'exact', head: true }).eq('channel', 'inbox').is('read_at', null)
]);
const recs = recsR.data || [];
let teacherName = '—';
if (teacherR.data) { const { data: tu } = await db.from('users').select('name').eq('id', teacherR.data.user_id).maybeSingle(); teacherName = tu?.name || '—'; }
const room = ra[0] ? (await db.from('audio_rooms').select('*').eq('id', ra[0].room_id).maybeSingle()).data : null;
let P = null, cols = [], days = {};
if (asg) {
  const [p, c, d] = await Promise.all([db.from('program_plans').select('*').eq('id', asg.plan_id).maybeSingle(), db.from('plan_columns').select('*').eq('plan_id', asg.plan_id).order('seq'), A.fetchAll(() => db.from('plan_days').select('id, day_number, vals').eq('plan_id', asg.plan_id))]);
  P = p.data; cols = c.data || []; d.forEach(x => days[x.day_number] = x);
}
const planLive = P && P.status === 'active';
const nDays = Object.keys(days).length;
const dayN = planLive ? A.planDayFor(asg, P, nDays) : null;
const today = dayN ? days[dayN] : null;
let unreadCount = unread.count || 0;

// الإحصاءات
const wd = P?.workdays || [0, 1, 2, 3, 4];
const startD = asg?.start_date || stu.join_date;
const expected = A.workdaysBetween(startD, A.addDays(TODAY, -1), wd);
const achDays = new Set(recs.filter(r => ['present', 'makeup', 'review_only'].includes(r.status) && r.rec_date < TODAY).map(r => r.rec_date)).size;
const excDays = new Set(recs.filter(r => r.status === 'excused').map(r => r.rec_date)).size;
const base = Math.max(0, expected - excDays);
const pct = base ? Math.min(100, Math.round(achDays / base * 100)) : null;
const scores = recs.filter(r => r.score != null).map(r => +r.score);
const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
const memorized = +memR.data || 0;

const TABS = [['home', 'الرئيسية', 'home'], ['log', 'سجلّي', 'book'], ['honor', 'لوحة الشرف', 'star'], ['leave', 'الاستئذان', 'leave'], ['inbox', 'الإشعارات', 'bell']];
const SECTIONS = {};

SECTIONS.home = async el => {
  let progress = new Set();
  if (planLive && today) { const { data } = await db.from('plan_progress').select('column_id').eq('student_id', stu.id).eq('plan_day_id', today.id); progress = new Set((data || []).map(x => x.column_id)); }
  const canExec = planLive && P.student_execution !== 'none';
  const tasks = planLive ? A.groupTasks(cols, c => ['student', 'both', 'info'].includes(c.executor)) : [];
  const now = A.nowMakkahHM(), dn = A.DAYS[A.dowMakkah()];
  const live = room && room.active && (room.days || []).includes(dn) && room.start_time && now >= room.start_time.slice(0, 5) && now <= (room.end_time || '23:59').slice(0, 5);
  el.innerHTML = `<section class="hero"><div class="eyebrow">${A.dayName(TODAY)} · ${A.hijri(TODAY)} · ${A.greg(TODAY)}</div><h2>${esc(me.name)}</h2>
    <div class="meta"><div><small>الخطة</small><b>${esc(P?.name || 'لم تُسند بعد')}</b></div><div><small>المعلم</small><b>${esc(teacherName)}</b></div><div><small>الفترة</small><b>${room ? esc(room.name) + ' · ' + (room.start_time || '').slice(0, 5) : '—'}</b></div></div></section>
    <div class="metrics">
      <div class="metric" style="--c:var(--teal)"><span>نسبة الإنجاز</span><b>${pct == null ? '—' : pct + '٪'}</b></div>
      <div class="metric" style="--c:var(--green)"><span>الأحاديث المحفوظة</span><b>${fmtNum(memorized, 1)}</b></div>
      <div class="metric" style="--c:var(--blue)"><span>جلسات التسميع</span><b>${fmtNum(recs.filter(r => ['present', 'makeup'].includes(r.status)).length)}</b></div>
      <div class="metric" style="--c:var(--violet)"><span>متوسط الدرجة</span><b>${avg == null ? '—' : fmtNum(avg, 2)}</b></div>
    </div>
    <div class="sec-h" style="--c:var(--teal)"><b>مهام اليوم</b><span>${planLive ? (A.workdaysBetween(TODAY, TODAY, wd) ? 'اليوم ' + dayN + ' من ' + nDays : 'اليوم إجازة في خطتك') : ''}</span></div>
    ${!P ? '<div class="empty">لم تُسند لك خطة بعد. تواصل مع إدارة البرنامج.</div>'
      : !planLive ? '<div class="empty">خطتك لم تُفعَّل بعد.</div>'
      : !A.workdaysBetween(TODAY, TODAY, wd) ? '<div class="empty">اليوم ليس من أيام الخطة. استرح وراجع ما حفظت.</div>'
      : `<div class="stack">${tasks.map(t => { const v = A.fmtTaskVal(t, today?.vals); if (v == null) return ''; const info = t.executor === 'info'; const can = canExec && !info; const on = t.cols.some(c => progress.has(c.id));
          const isUrl = t.single?.value_type === 'url';
          return `<div class="task"><button type="button" class="tick ${can ? (on ? 'on' : '') : 'none'}" ${can ? `data-tick="${t.key}" aria-pressed="${on}" aria-label="${on ? 'إلغاء الإنجاز' : 'تم الإنجاز'}"` : 'disabled aria-hidden="true"'}>${on ? '✓' : ''}</button>
            <div><b>${esc(t.name)}</b><span class="v">${isUrl ? `<a href="${esc(today.vals[t.single.id])}" target="_blank" rel="noopener">فتح الرابط</a>` : t.single?.value_type === 'bool' ? 'مطلوب اليوم' : esc(v)}</span></div></div>`; }).join('') || '<div class="empty">لا مهام في هذا اليوم.</div>'}</div>
      ${canExec ? `<p class="note">${P.student_execution === 'counts' ? 'علّم على المهمة بعد إنجازها، ويدخل تنفيذك في تقييمك.' : 'علّم على المهمة بعد إنجازها لمتابعة نفسك.'}</p>` : ''}
      ${A.isRecitationDay(P, TODAY) ? `<div class="hintbox" style="margin-top:8px">اليوم يوم تسميع${room ? ' في ' + esc(room.name) : ''}.</div>` : ''}`}
    <div class="section"><div class="sec-h" style="--c:var(--gold)"><b>روابط مهمة</b></div><div class="links">
      ${room?.meet_url ? (live || room.outside_behavior === 'always_visible' ? `<a href="${esc(room.meet_url)}" target="_blank" rel="noopener">${svg('room')}ادخل غرفة التسميع</a>` : room.outside_behavior === 'hidden' ? '' : `<a aria-disabled="true" style="opacity:.55;pointer-events:none">${svg('room')}الغرفة تُفتح ${(room.start_time || '').slice(0, 5)}</a>`) : ''}
      ${P?.audio_url ? `<a href="${esc(P.audio_url)}" target="_blank" rel="noopener">${svg('mic')}السماع</a>` : ''}${P?.book_url ? `<a href="${esc(P.book_url)}" target="_blank" rel="noopener">${svg('book')}الكتاب</a>` : ''}${P?.whatsapp_url ? `<a href="${esc(P.whatsapp_url)}" target="_blank" rel="noopener">${svg('users')}مجموعة البرنامج</a>` : ''}
    </div></div>`;
  $$('[data-tick]', el).forEach(b => b.onclick = async () => {
    const t = tasks.find(x => x.key === b.dataset.tick); const on = b.getAttribute('aria-pressed') === 'true';
    b.disabled = true;
    const res = on ? await db.from('plan_progress').delete().eq('student_id', stu.id).eq('plan_day_id', today.id).in('column_id', t.cols.map(c => c.id))
      : await db.from('plan_progress').insert({ student_id: stu.id, plan_day_id: today.id, column_id: t.key });
    if (res.error) { b.disabled = false; return toast('لم يُحفظ: ' + res.error.message, true); }
    toast(on ? 'أُلغي الإنجاز' : 'أحسنت، سُجّل الإنجاز'); route();
  });
};

SECTIONS.log = el => {
  const rows = recs.map(r => ({ r, date: r.rec_date, st: STATUS[r.status]?.label, memo: r.memo_from ? `${+r.memo_from}–${+r.memo_to}` : '', score: r.score != null ? +r.score : null, mk: r.makes_up_date ? A.greg(r.makes_up_date) : '', notes: r.notes || '' }));
  el.innerHTML = `<div class="sec-h" style="--c:var(--blue)"><b>سجلّي</b><span>${recs.length} سجل</span></div>
    <div class="metrics"><div class="metric" style="--c:var(--green)"><span>أيام الإنجاز</span><b>${achDays}</b></div><div class="metric" style="--c:var(--violet)"><span>أيام الاستئذان</span><b>${excDays}</b></div><div class="metric" style="--c:var(--red)"><span>غياب تقديري</span><b>${Math.max(0, base - achDays)}</b></div><div class="metric" style="--c:var(--teal)"><span>أيام الخطة حتى أمس</span><b>${expected}</b></div></div>
    <div class="card c-blue"><div id="tbl"></div></div>`;
  A.dataTable($('#tbl'), { rows, sortKey: 'date', dir: -1, pageSize: 10, cols: [{ key: 'date', label: 'التاريخ', html: x => A.dayName(x.date) + ' ' + A.greg(x.date) }, { key: 'st', label: 'الحالة', filter: true, html: x => statusPill(x.r.status) }, { key: 'memo', label: 'الحفظ' }, { key: 'score', label: 'الدرجة', num: true, html: x => x.score == null ? '—' : fmtNum(x.score, 2) }, { key: 'mk', label: 'تعويض عن' }, { key: 'notes', label: 'ملاحظات المعلم' }] });
};

SECTIONS.honor = async el => {
  const st = SECTIONS.honor.st ||= { period: 'month', more: false };
  const from = st.period === 'month' ? TODAY.slice(0, 8) + '01' : null;
  const { data, error } = await db.rpc('honor_board', { p_plan: asg?.plan_id || null, p_from: from, p_to: null });
  if (error) { el.innerHTML = `<div class="error">${esc(error.message)}</div>`; return; }
  const list = (data || []).filter(x => +x.memorized > 0);
  const myRank = list.findIndex(x => x.student_id === stu.id);
  const shown = st.more ? list : list.slice(0, 10);
  el.innerHTML = `<div class="sec-h" style="--c:var(--gold)"><b>لوحة الشرف</b><span>${esc(P?.name || '')}</span><div class="acts"><div class="seg"><button type="button" data-p="month" aria-pressed="${st.period === 'month'}">هذا الشهر</button><button type="button" data-p="all" aria-pressed="${st.period === 'all'}">منذ البداية</button></div></div></div>
    ${myRank >= 0 ? `<div class="hintbox" style="margin-bottom:10px">ترتيبك: <b>${myRank + 1}</b> من ${list.length}</div>` : ''}
    <div class="card">${shown.map((x, i) => `<div class="rank-row${x.student_id === stu.id ? ' me' : ''}"><span class="r">${i + 1}</span><b>${esc(x.name)}${x.student_id === stu.id ? ' <span class="pill gold">أنت</span>' : ''}</b><span class="small"><b style="color:var(--teal)">${fmtNum(x.memorized, 1)}</b> حديث · ${x.avg_score != null ? fmtNum(x.avg_score, 2) : '—'}</span></div>`).join('') || '<div class="empty">لا توجد بيانات بعد</div>'}
      ${list.length > 10 ? `<button class="btn ghost block" id="more" style="margin-top:8px">${st.more ? 'عرض أول 10 فقط' : 'عرض المزيد'}</button>` : ''}</div>`;
  $$('[data-p]', el).forEach(b => b.onclick = () => { st.period = b.dataset.p; st.more = false; route(); });
  $('#more') && ($('#more').onclick = () => { st.more = !st.more; route(); });
};

SECTIONS.leave = async el => {
  const { data } = await db.from('leave_requests').select('*').eq('student_id', stu.id).order('created_at', { ascending: false });
  const lim = P?.discipline_rules?.leave_max_month;
  const month = TODAY.slice(0, 7);
  const used = (data || []).filter(l => l.status === 'approved' && l.date_from.slice(0, 7) === month).reduce((a, l) => a + A.daysBetween(l.date_from, l.date_to) + 1, 0);
  el.innerHTML = `<div class="sec-h" style="--c:var(--violet)"><b>طلب استئذان</b>${lim != null ? `<span>استخدمت ${used} من ${lim} أيام هذا الشهر</span>` : ''}</div>
    <form class="card c-violet stack" id="lf">
      <div class="g2"><label class="f" for="lF">من<input id="lF" type="date" value="${TODAY}" min="${TODAY}" required></label><label class="f" for="lT">إلى<input id="lT" type="date" value="${TODAY}" min="${TODAY}" required></label></div>
      <label class="f" for="lR">السبب<select id="lR"><option>سفر</option><option>مرض</option><option>اختبارات دراسية</option><option>ظرف عائلي</option><option>أخرى</option></select></label>
      <label class="f" for="lD">تفاصيل <span class="hint">اختياري</span><textarea id="lD"></textarea></label>
      <p class="hint">يصل طلبك لإدارة البرنامج، ويصلك إشعار بالقرار. الاستئذان المقبول لا يُحسب غيابًا.</p>
      <button class="btn" type="submit">إرسال الطلب</button></form>
    <div class="section"><div class="card"><h3>طلباتي</h3>${(data || []).map(l => `<div class="row" style="border-bottom:1px dashed var(--soft-line);padding:7px 0"><span>${A.greg(l.date_from)}${l.date_to !== l.date_from ? ' – ' + A.greg(l.date_to) : ''} · ${esc(l.reason)}</span><span class="pill ${{ pending: 'warn', approved: 'ok', rejected: 'bad', cancelled: 'plain' }[l.status]}">${{ pending: 'قيد المراجعة', approved: 'مقبول', rejected: 'مرفوض', cancelled: 'ملغى' }[l.status]}</span></div>`).join('') || '<p class="muted small" style="margin-top:6px">لا توجد طلبات</p>'}</div></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const f = $('#lF').value, t = $('#lT').value;
    if (!f || !t || t < f) return toast('تاريخ النهاية يجب ألا يسبق البداية', true);
    const { error } = await db.from('leave_requests').insert({ student_id: stu.id, date_from: f, date_to: t, reason: $('#lR').value, details: $('#lD').value.trim() || null });
    if (error) return toast('لم يُرسل: ' + error.message, true);
    toast('أُرسل الطلب'); route();
  };
};

SECTIONS.inbox = async el => {
  const { data } = await db.from('notifications').select('*').eq('channel', 'inbox').order('created_at', { ascending: false }).limit(150);
  el.innerHTML = `<div class="sec-h" style="--c:var(--blue)"><b>الإشعارات</b><div class="acts"><button class="btn ghost sm" id="all">تعليم الكل كمقروء</button></div></div>
    <div class="card">${(data || []).map(n => `<div class="inbox-item${n.read_at ? ' read' : ''}" data-id="${n.id}"><span class="dot"></span><div><div class="row"><b>${esc(n.title)}</b><span class="small muted">${A.greg(n.created_at.slice(0, 10))}</span></div><p class="small" style="margin-top:3px;line-height:1.8">${esc(n.body)}</p></div></div>`).join('') || '<div class="empty">لا توجد إشعارات</div>'}</div>`;
  const mark = async ids => { if (!ids.length) return; await db.from('notifications').update({ read_at: new Date().toISOString() }).in('id', ids); unreadCount = Math.max(0, unreadCount - ids.length); route(); };
  $$('.inbox-item:not(.read)', el).forEach(i => i.onclick = () => mark([i.dataset.id]));
  $('#all').onclick = () => mark((data || []).filter(n => !n.read_at).map(n => n.id));
};

function route() {
  const k = (location.hash || '#home').slice(1);
  const key = SECTIONS[k] ? k : 'home';
  $('#tabbar').innerHTML = TABS.map(([h, l, ic]) => `<a href="#${h}" aria-current="${h === key ? 'page' : 'false'}">${svg(ic)}${l}${h === 'inbox' && unreadCount ? `<span class="badge">${unreadCount}</span>` : ''}</a>`).join('');
  $('#main').innerHTML = '<div class="loading">جارٍ التحميل…</div>';
  Promise.resolve(SECTIONS[key]($('#main'))).catch(e => $('#main').innerHTML = `<div class="error">${esc(e.message || e)}</div>`);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
</html>
