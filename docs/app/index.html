<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الدخول — منصة سنن</title>
<meta name="theme-color" content="#0F2F33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سنن">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=20261127h">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js?v=20261127h"></script>
<style>
.pwbox{position:relative;display:block}.pwbox input{padding-left:44px}
.pweye{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:#5b6b6d;cursor:pointer;display:grid;place-items:center;border-radius:8px}
.pweye:hover,.pweye:focus-visible{background:#eef2f2;color:#0F2F33}
body{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(145deg,var(--primary),var(--secondary))}
.wrap{flex:1;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.box{width:100%;max-width:420px;display:grid;gap:16px}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;text-align:center}
.logo .m{width:62px;height:62px;border-radius:16px;border:2px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:20px;font-weight:800}
.logo h1{font-size:24px;font-weight:800}.logo p{color:#C9DADA;font-size:13.5px}
.card{border-top-color:var(--gold);padding:20px 20px 22px;border-radius:18px;box-shadow:0 18px 45px rgba(0,0,0,.22);gap:14px}
.card input{min-height:46px;font-size:15px;border-radius:12px}
.card .btn{min-height:46px;font-size:15px;border-radius:12px}
.roles-note{color:#C9DADA;font-size:12px;text-align:center;line-height:1.9}
</style>
</head>
<body>
<div class="wrap"><div class="box">
  <div class="logo"><span class="m">سنن</span><h1>منصة سنن للتعليم عن بعد</h1><p>جمعية سنن التعليمية</p></div>
  <form class="card" id="f" novalidate>
    <div class="error" id="err" hidden></div>
    <label class="f" for="email">البريد الإلكتروني<input id="email" type="email" dir="ltr" autocomplete="email" required placeholder="name@example.com"></label>
    <label class="f" for="pw">كلمة المرور<span class="pwbox"><input id="pw" type="password" dir="ltr" autocomplete="current-password" required><button type="button" id="pwEye" class="pweye" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path id="pwSlash" d="M3 3l18 18" style="display:none"/></svg></button></span></label>
    <button class="btn block" type="submit" id="go">دخول</button>
  </form>
  <p class="roles-note">صفحة دخول واحدة للطالب والمعلم والمشرف، وتنقلك المنصة لصفحتك حسب حسابك.</p>
</div></div>
<script>
(async () => {
  const { db, $, homeOf } = App;
  const showErr = m => { $('#err').textContent = m; $('#err').hidden = false; };
  if (new URLSearchParams(location.search).get('e')) showErr('حسابك غير مفعّل في المنصة. تواصل مع المشرف.');
  // بعد تسجيل الخروج لا يُعاد التوجيه تلقائيًا إلى اللوحة
  const justOut = new URLSearchParams(location.search).has('out');
  if (justOut) { try { await db.auth.signOut({ scope: 'local' }); } catch (e) {} history.replaceState(null, '', 'index.html'); }
  const { data: { session } } = justOut ? { data: {} } : await db.auth.getSession();
  if (session) {
    const { data: me } = await db.from('users').select('role').eq('id', session.user.id).maybeSingle();
    if (me) return location.replace(homeOf(me.role));
  }
  $('#pwEye').onclick = () => { const i = $('#pw'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; const e = $('#pwEye'); e.setAttribute('aria-pressed', show); e.title = e.ariaLabel = show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'; $('#pwSlash').style.display = show ? '' : 'none'; i.focus(); };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  $('#f').addEventListener('submit', async e => {
    e.preventDefault(); $('#err').hidden = true;
    const email = $('#email').value.trim().toLowerCase(), pw = $('#pw').value;
    if (!email || !pw) return showErr('اكتب البريد الإلكتروني وكلمة المرور.');
    const b = $('#go'); b.disabled = true; b.textContent = 'جارٍ الدخول…';
    const { data, error } = await db.auth.signInWithPassword({ email, password: pw });
    if (error) { b.disabled = false; b.textContent = 'دخول'; return showErr('البريد الإلكتروني أو كلمة المرور غير صحيحة.'); }
    const { data: me } = await db.from('users').select('role').eq('id', data.user.id).maybeSingle();
    if (!me) { await db.auth.signOut(); b.disabled = false; b.textContent = 'دخول'; return showErr('حسابك غير مسجّل في المنصة. تواصل مع المشرف.'); }
    location.replace(homeOf(me.role));
  });
})();
</script>
</body>
</html>
